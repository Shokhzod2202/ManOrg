<style>
body{margin:0;background:#FFFFFF}
a{color:#0B3A8C}a:hover{color:#082C6B}
.muted{color:#566078}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;background:#EAF0FA;color:#082C6B;font-size:14px}
.views{display:flex;background:#F1F3F8;border-radius:12px;padding:4px;gap:2px}
.views a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:9px;text-decoration:none;color:#2F3648;font:600 15px Inter,sans-serif}
.views a.on{background:#FFFFFF;color:#0B3A8C;box-shadow:0 1px 2px rgba(15,26,51,.12)}
.tab{min-height:44px;padding:0 18px;border:1px solid #CAD2E0;border-radius:22px;background:#FFFFFF;font:600 15px Inter,sans-serif;color:#2F3648}
.tab.on{background:#0B3A8C;border-color:#0B3A8C;color:#FFFFFF}
.badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font:700 11px Inter,sans-serif;white-space:nowrap}
.b-up{background:#0B3A8C;color:#FFFFFF}
.b-ask{background:#FFF1CC;color:#6B4600;border:1px solid #E9C66B}
.alert{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 18px;border-radius:12px;background:#FFF1CC;border:1px solid #E9C66B;color:#6B4600;text-decoration:none;font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 12px;border:1px solid #E4E8F0;border-radius:14px;background:#FFFFFF;font-family:Inter,sans-serif;text-align:center;min-height:116px;justify-content:center}
.tile .badge{position:absolute;top:-8px;right:6px}
.tn{font:600 14px Inter,sans-serif;color:#2F3648;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tq{font:800 34px Montserrat,sans-serif;color:#0F1A33;line-height:1.05}
.st{display:inline-flex;align-items:center;gap:4px;font:600 12px Inter,sans-serif;color:#24622A}
.st.todo{color:#566078}
.bar{position:absolute;left:10px;right:10px;bottom:6px;height:4px;border-radius:2px;background:#EEF1F6;overflow:hidden}
.bar span{display:block;height:100%;background:#24622A}
.tile.done{background:#F1F8F1;border-color:#9CC9A0}
.tile.done .tq{color:#24622A}
.tile.part{border-color:#9CC9A0}
</style>
</helmet>
