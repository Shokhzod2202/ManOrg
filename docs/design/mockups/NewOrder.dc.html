<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B3A8C}a:hover{color:#082C6B}
.muted{color:#566078;font-size:13px}
.day{min-height:40px;border:none;border-radius:20px;background:transparent;font:500 14px Inter,sans-serif;color:#0F1A33}
.day.past{color:#8E8C86}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F1F3F8}
.step{width:44px;height:44px;border-radius:22px;border:1px solid #CAD2E0;background:#FFFFFF;font:600 20px Inter,sans-serif;color:#082C6B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, sans-serif; color: #0F1A33; display: flex; flex-direction: column">
  <div style="flex: 1; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; flex-direction: column; gap: 2px">
      <img src="/_blob/b59ddbcc1d51170e6bd5858141cd7232" alt="Haydar Inc" style="width: 44px; height: 44px; object-fit: contain; margin-bottom: 4px">
      <div class="muted">City Cafe ordering from</div>
      <h1 style="margin: 0; font: 700 24px Montserrat, sans-serif">Sunrise Bakery</h1>
    </header>

    <div role="alertdialog" aria-labelledby="ask" style="background: #F4F7FC; border: 1px solid #BFD0EE; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div id="ask" style="font-weight: 600">It is 08:40. Is this order for today?</div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; min-height: 44px; border-radius: 10px; border: none; background: #0B3A8C; color: #FFFFFF; font: 600 14px Inter, sans-serif">Yes, today (Fri 13)</button>
        <button type="button" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #0B3A8C; background: #FFFFFF; color: #082C6B; font: 600 14px Inter, sans-serif">No, tomorrow</button>
      </div>
    </div>

    <section aria-labelledby="cal" style="background: #FFFFFF; border: 1px solid #E4E8F0; border-radius: 14px; padding: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px 6px">
        <h2 id="cal" style="margin: 0; font: 600 15px Inter, sans-serif">Delivery date · November</h2>
        <span class="muted">Delivery 11:00 to 12:00</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center">
        <span class="muted">Mo</span><span class="muted">Tu</span><span class="muted">We</span><span class="muted">Th</span><span class="muted">Fr</span><span class="muted">Sa</span><span class="muted">Su</span>
        <button type="button" class="day past" disabled>9</button><button type="button" class="day past" disabled>10</button><button type="button" class="day past" disabled>11</button><button type="button" class="day past" disabled>12</button>
        <button type="button" class="day" aria-pressed="true" style="background: #082C6B; color: #FFFFFF; font-weight: 700">13</button>
        <button type="button" class="day">14</button><button type="button" class="day">15</button>
        <button type="button" class="day">16</button><button type="button" class="day">17</button><button type="button" class="day">18</button><button type="button" class="day">19</button><button type="button" class="day">20</button><button type="button" class="day">21</button><button type="button" class="day">22</button>
      </div>
    </section>

    <section aria-labelledby="prod" style="display: flex; flex-direction: column">
      <h2 id="prod" style="margin: 0 0 4px; font: 600 15px Inter, sans-serif">Products</h2>
      <div class="item">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: #E3EAF6"></span>
        <span style="flex: 1">Bread</span>
        <button type="button" class="step" aria-label="Less bread">−</button>
        <span style="width: 36px; text-align: center; font-weight: 700">30</span>
        <button type="button" class="step" aria-label="More bread">+</button>
      </div>
      <div class="item">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: #DDE6F4"></span>
        <span style="flex: 1">Somsa</span>
        <button type="button" class="step" aria-label="Less somsa">−</button>
        <span style="width: 36px; text-align: center; font-weight: 700">20</span>
        <button type="button" class="step" aria-label="More somsa">+</button>
      </div>
      <div class="item">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: #D6E0F1"></span>
        <span style="flex: 1">Pilaf</span>
        <button type="button" class="step" aria-label="Less pilaf">−</button>
        <span style="width: 36px; text-align: center; font-weight: 700">0</span>
        <button type="button" class="step" aria-label="More pilaf">+</button>
      </div>
    </section>
  </div>

  <div style="padding: 12px 16px 20px; border-top: 1px solid #E4E8F0; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
    <button type="button" style="min-height: 56px; border-radius: 14px; border: none; background: #0B3A8C; color: #FFFFFF; font: 700 17px Inter, sans-serif">Place order for Fri 13 Nov</button>
    <div class="muted" style="text-align: center">After placing, changes go to the bakery as a request.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
