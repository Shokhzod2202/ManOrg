name: manorg

services:
  db:
    image: postgres:16-alpine
    environment:
      # Superuser for administration only; the app never connects with it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      # Roles created by postgres/init/01-roles.sh (see infra/README.md).
      MANORG_OWNER_PASSWORD: ${MANORG_OWNER_PASSWORD:-manorg_owner_dev}
      MANORG_APP_PASSWORD: ${MANORG_APP_PASSWORD:-manorg_app_dev}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d manorg']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  redis-data:
