name: manorg

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: manorg
      POSTGRES_USER: manorg_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manorg_owner_dev}
      # Runtime role used by the API; it does not own the tables, so row-level security applies.
      MANORG_APP_PASSWORD: ${MANORG_APP_PASSWORD:-manorg_app_dev}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manorg_owner -d manorg']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  redis-data:
