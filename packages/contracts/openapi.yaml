          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected, cancelled, reversed] }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [items, nextCursor],
                  properties:
                    {
                      items: { type: array, items: { $ref: '#/components/schemas/Payment' } },
                      nextCursor: { $ref: '#/components/schemas/NextCursor' },
                    },
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/{id}/cancel:
    post:
      operationId: cancelPayment
      summary: 'Withdraw a pending submission (contractor, F2)'
      tags: [finance]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
