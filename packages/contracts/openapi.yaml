    post:
      operationId: createIngredient
      summary: Add an ingredient (ING-1, ING-8)
      tags: [ingredients]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIngredientRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingredients/{id}:
    get:
      operationId: getIngredient
      tags: [ingredients]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The ingredient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateIngredient
      summary: Edit an ingredient, including what one pack contains (ING-2)
      description: The price has its own endpoint so that a change only affects the future.
      tags: [ingredients]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIngredientRequest' }
      responses:
        '200':
          description: The updated ingredient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /ingredients/{id}/price:
    put:
      operationId: setIngredientPrice
      summary: Set a new price per pack, in whole won
      description: Effective from now; earlier prices stay in the history and past calculations keep using them.
      tags: [ingredients]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packPrice]
              properties:
                packPrice: { type: integer, minimum: 0, description: Whole won per pack. }
      responses:
        '200':
          description: The ingredient with its new current price.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingredients/{id}/prices:
    get:
      operationId: listIngredientPrices
      summary: Price history, newest first
      tags: [ingredients]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Every price the ingredient has had.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, packPrice, effectiveFrom, createdById]
                      properties:
                        id: { type: string, format: uuid }
                        packPrice: { type: integer }
                        effectiveFrom: { type: string, format: date-time }
                        createdById: { type: string, format: uuid }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingredients/{id}/responsible:
    put:
      operationId: setIngredientResponsible
      summary: Set the employees responsible for ordering an ingredient (ING-4)
      description: Replaces the whole list; send an empty list to clear it. Audited.
      tags: [ingredients]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employeeIds]
              properties:
                employeeIds:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The ingredient with its responsible employees.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /product-images:
    post:
      operationId: uploadProductImage
      summary: Upload a product picture (PRD-1)
      description: JPEG, PNG or WebP up to 5 MB, detected from the file's bytes. Send the returned imageKey when creating or editing a product.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [imageKey, imageUrl]
                properties:
                  imageKey: { type: string }
                  imageUrl: { type: string, description: Short-lived link to the picture. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: The picture is larger than 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products:
    get:
      operationId: listProducts
      summary: The organization's products, available or not (PRD-2)
      tags: [products]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Products by name.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProduct
      summary: Add a product (PRD-1)
      description: Name and minutes per 10 are required. The picture (imageKey from /product-images), ingredients and price can be added now or later by editing.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProduct
      summary: Edit any product field, or set availability (PRD-2)
      description: An unavailable product cannot be ordered but stays in history. Ingredients, when sent, replace the list.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /employees/{id}/products:
    get:
      operationId: listEmployeeProducts
      summary: Products assigned to an employee (PRD-3)
      description: Admins and the bot see anyone's; an employee sees only their own (their output form lists only these).
      tags: [products]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Assigned products.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setEmployeeProducts
      summary: Assign products to an employee (PRD-3)
      description: Replaces the whole list. Audited.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productIds]
              properties:
                productIds:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The employee's products after the change.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files/{key}:
    get:
      operationId: getFile
      summary: Download a stored file through a signed, expiring link
      description: Links come from API responses (for example Product.imageUrl). Used with local storage; production links point at the bucket instead.
      tags: [system]
      security: []
      x-tenant-scoped: false
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts:
    get:
      operationId: listShiftPlans
      summary: 'Weekly planned shifts (SHF-1, SHF-2)'
      description: "Everyone's plans for admins and for employees when All employees' shifts is open in Employee access; otherwise only the caller's own."
      tags: [shifts]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: employee_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShiftPlan' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setShiftPlan
      summary: "Set an employee's weekly plan (SHF-1)"
      description: 'Replaces the whole week. A day whose end time is not after its start time ends on the next day. Audited.'
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetShiftPlanRequest' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftPlanResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /punch/arrival:
    post:
      operationId: checkArrival
      summary: 'The phone entered the bakery geofence: should it say "You came to work. Start shift"?'
      description: 'Spec section 9. No location is sent or stored. Prompts only when the organization has it on, the employee has not turned it off, there is a planned shift within the window around its start, and no shift is running. It never punches: the employee still taps Start Shift.'
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArrivalCheck' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /punch/card:
    get:
      operationId: getPunchCard
      summary: "The caller's punch card (SHF-3)"
      tags: [shifts]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PunchCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /punch:
    post:
      operationId: punch
      summary: 'Start, pause, resume or end the shift (SHF-3)'
      description: 'Recorded at the server time; the client sends no time. A repeated Idempotency-Key records nothing new. 409 PUNCH_NOT_ALLOWED when the action is out of order.'
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PunchRequest' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PunchCard' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listPunchHistory
      summary: 'Punch history with plan, worked minutes and red flags (SHF-6)'
      description: "Without employee_id, the caller's own. Another employee's history needs the admin's punch permissions (403 otherwise)."
      tags: [shifts]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: employee_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timesheet' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /punch/{id}:
    patch:
      operationId: editPunch
      summary: 'Move a punch to another time (SHF-4)'
      description: 'Audited with old value, new value, editor and time.'
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditPunchRequest' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PunchEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /punch-events:
    post:
      operationId: addPunch
      summary: 'Add a missing punch for an employee (SHF-4)'
      description: 'For example a forgotten End Shift. Audited.'
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPunchRequest' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PunchEvent' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /work-hours:
    get:
      operationId: getWorkHours
      x-tenant-scoped: true
      summary: Worked hours and advances for one month
      description: >-
        Decided 2026-11-30. Hours come from punch cards only, never the shift plan: a shift counts
        once ended, on the local date it started, paused time left out. Admins see everyone who
        works shifts (removed people only for months they worked or were paid in); anyone else sees
        only themselves (403 for another person).
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: month
          in: query
          description: YYYY-MM; defaults to the current month in the organization's time zone.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: employee_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The month.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkHoursMonth' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /salary-advances:
    post:
      operationId: createSalaryAdvance
      summary: Log an advance on salary (avans)
      description: >-
        Admins log it when they transfer the money (decided 2026-11-30). paidOn defaults to today
        and may not be in the future. Audited. Never edited or deleted; cancel a mistake instead.
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employeeId, amount]
              properties:
                employeeId: { type: string, format: uuid }
                amount: { type: integer, minimum: 1, maximum: 100000000, description: Whole won. }
                paidOn: { type: string, format: date }
                note: { type: string, maxLength: 200 }
      responses:
        '201':
          description: The advance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalaryAdvance' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /salary-advances/{id}/cancel:
    post:
      operationId: cancelSalaryAdvance
      summary: Cancel a mistaken advance
      description: It stays listed as cancelled and no longer counts. Audited. 409 ALREADY_CANCELLED.
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The cancelled advance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalaryAdvance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /hourly-rates:
    get:
      operationId: listHourlyRates
      x-tenant-scoped: true
      summary: Everyone's current hourly cost (owners only)
      description: Decided 2026-11-26. Owners only; other admins, employees and the bot get 403.
      tags: [shifts]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
