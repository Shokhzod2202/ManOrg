        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/due-next:
    get:
      operationId: getOrdersDueNext
      summary: "Today's Orders: every contractor's order due next (TOD-1 to TOD-4)"
      description: 'For each contractor, its earliest order whose delivery is not completed, by delivery date then approximate time. It does not change at midnight. Totals are the sum of these orders.'
      tags: [deliveries]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: contractor_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DueNextOrders' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /employees/{id}/orders/due-next:
    get:
      operationId: getEmployeeOrdersDueNext
      summary: "My Orders: an employee's products in the orders due next (TOD-5 to TOD-7)"
      description: "Only products assigned to the employee, each at the full quantity. Employees open their own; admins open anyone's."
      tags: [deliveries]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDueNextOrders' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dashboard/today:
    get:
      operationId: getTodayDashboard
      summary: "Today's Dashboard, the admin's home (DSH-1)"
      description: "Who is on shift now (night shifts that began yesterday included), today's red flags, output totals, open tasks due, today's deliveries, the orders due next, and what is waiting for a decision."
      tags: [dashboards]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodayDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dashboard/home:
    get:
      operationId: getEmployeeHome
      summary: "The employee's home (DSH-2)"
      description: "Punch card, today's output, own open tasks and My Orders in one call."
      tags: [dashboards]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeHome' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/due-next/made:
    post:
      operationId: markMade
      summary: 'Tick a product as made, or not, in the orders due next'
      description: 'For every contractor, or one (contractorId). Employees, admins and the bot. Audited. Ticks stay through order changes, up to the new quantity.'
      tags: [deliveries]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkMadeRequest' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DueNextOrders' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /applications:
    get:
      operationId: listApplications
      summary: Pending employee and contractor applications (bakery admin)
      tags: [applications]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Pending applications, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /applications/{id}/approve:
    post:
      operationId: approveApplication
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Approved. An employee gets the Employee role; a contractor may order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /applications/{id}/reject:
    post:
      operationId: rejectApplication
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /members:
    get:
      operationId: listMembers
      summary: Members of the organization (admins)
      tags: [members]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string, enum: [active, removed], default: active }
        - name: limit
          in: query
          description: Up to 100 at a time; 100 unless asked otherwise (decided 2026-11-26).
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Members, oldest first; removed members newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createMember
      summary: Add an existing account, e.g. as another admin (ACC-7)
      description: Contractor organizations take admins only.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMemberRequest' }
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /members/{id}:
    patch:
      operationId: updateMember
      summary: Change a member's role, remove them, or switch whether an admin works shifts (ACC-7)
      description: Audited. The organization always keeps one active admin. Only owners make, demote or remove admins (an admin may step down or leave); an owner cannot be demoted or removed. Takes effect on the member's next request.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /members/{id}/hand-over:
    post:
      operationId: handOverMember
      summary: Clear a person's future work, or hand it to another employee
      description: For admins. Takes the person out of the weekly shift plan, teams, open and repeating tasks, ingredient ordering and the products they log; with toUserId, the other active member takes all of it (shift days the other person already works stay theirs). Punches, output, finished tasks and the audit log never change. Audited.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toUserId]
              properties:
                toUserId:
                  type: [string, 'null']
                  format: uuid
                  description: The person who takes it over; null to just clear it.
      responses:
        '200':
          description: What was moved or cleared.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    toUserId,
                    shiftDays,
                    shiftDaysKept,
                    teams,
                    tasks,
                    repeatingTasks,
                    ingredients,
                    products,
                  ]
                properties:
                  toUserId: { type: [string, 'null'], format: uuid }
                  shiftDays: { type: integer }
                  shiftDaysKept:
                    type: integer
                    description: Days the other person already worked; their own shift stays.
                  teams: { type: integer }
                  tasks: { type: integer }
                  repeatingTasks: { type: integer }
                  ingredients: { type: integer }
                  products: { type: integer }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /members/{id}/restore:
    post:
      operationId: restoreMember
      summary: Undo a removal
      description: Within 3 days of the removal (409 UNDO_EXPIRED after that; 409 ALREADY_MEMBER if they have applied or joined again). Admins need an owner. Work already handed over stays with its new person. Audited. Decided 2026-11-30.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The member, active again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /members/{id}/owner:
    post:
      operationId: addOwner
      summary: Make a member an owner too
      description: Owners only. Ownership is shared; the caller stays an owner. An employee also becomes an admin. Audited.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The new owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: leaveOwnership
      summary: Stop being an owner
      description: For your own membership, you stay an admin. Owners never take ownership from each other, except that for 3 days the owner who made someone an owner may undo it and the person returns to their earlier role (409 UNDO_EXPIRED after that; decided 2026-11-30). At least one owner stays (409 LAST_OWNER). Audited.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Your membership, no longer an owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: true
      description: The organization the request acts in; must be one of the caller's active memberships.
      schema: { type: string, format: uuid }
    OptionalOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `version` of the record being edited.
      schema: { type: string, example: '"3"' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: '`nextCursor` from the previous page.'
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: The request is not valid; `fields` names each problem.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing, expired or wrong credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The caller's role does not allow this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or not in the caller's organization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with the current state (for example VERSION_CONFLICT, ALREADY_IN_ORGANIZATION, LAST_ADMIN).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: The request is valid but breaks a business rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: If-Match is required on this edit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many attempts; wait a minute.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    NextCursor:
      type: [string, 'null']
      format: uuid

    OrganizationType:
      type: string
      enum: [provider, contractor]
      description: A provider sells (a bakery, a cake shop or any producer); a contractor buys.
    MembershipRole:
      type: string
      enum: [admin, employee]
    MembershipStatus:
      type: string
      enum: [pending, active, rejected, removed]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 200 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
    UserSummary:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email:
          type: [string, 'null']
          format: email
          description: Empty for an account made through Telegram that has not added one yet.
        avatarUrl:
          type: [string, 'null']
          description: Short-lived link to the profile picture.
    AuthResult:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    Me:
      type: object
      required: [id, name, email, hasPassword, avatarUrl, locale, memberships]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email:
          type: [string, 'null']
          format: email
          description: Empty for an account made through Telegram that has not added one yet.
        hasPassword:
          type: boolean
          description: False until an account made through Telegram sets a password.
        avatarUrl:
          type: [string, 'null']
          description: Short-lived link to the profile picture.
        locale: { type: string, enum: [en, ko, uz] }
        preferences: { $ref: '#/components/schemas/Preferences' }
        memberships:
          type: array
          description: Newest first; includes pending and rejected applications.
          items:
            type: object
            required: [id, role, status, owner, worksShifts, displayName, title, organization]
            properties:
              id: { type: string, format: uuid }
              role: { $ref: '#/components/schemas/MembershipRole' }
              status: { $ref: '#/components/schemas/MembershipStatus' }
              owner:
                type: boolean
                description: An owner of the organization; owners alone change who is an admin. Ownership can be shared.
              worksShifts:
                type: boolean
                description: Has a punch card and shows in shift lists (always true for employees).
              displayName:
                type: [string, 'null']
                description: The name this organization's admins gave you.
              title: { type: [string, 'null'] }
              organization: { $ref: '#/components/schemas/OrganizationSummary' }
    TelegramStatus:
      type: object
      required: [available, botUsername, connected, username, connectedAt]
      properties:
        available: { type: boolean, description: 'False when the server has no bot token.' }
        botUsername: { type: string, example: haydar_inc_bot }
        connected: { type: boolean }
        username:
          { type: [string, 'null'], description: 'Telegram username, when the person has one.' }
        connectedAt: { type: [string, 'null'], format: date-time }
    TelegramLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, example: 'https://t.me/haydar_inc_bot?start=abc' }
        expiresAt: { type: string, format: date-time }
    BotStatus:
      type: object
      required: [available, model, bulkRows, usage]
      properties:
        available: { type: boolean }
        model:
          { type: [string, 'null'], description: 'provider:model, e.g. anthropic:claude-opus-5-5' }
        bulkRows:
          {
            type: integer,
            description: 'Above this many rows a proposal needs a second confirmation.',
          }
        usage:
          type: object
          required: [month, usedTokens, budgetTokens, requests]
          properties:
            month: { type: string, example: '2026-11' }
            usedTokens: { type: integer }
            budgetTokens: { type: integer }
            requests: { type: integer }
    BotMessage:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [admin, bot] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    BotProposal:
      type: object
      required:
        [
          id,
          tool,
          summary,
          rows,
          changes,
          status,
          needsSecondConfirmation,
          error,
          expiresAt,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        tool: { type: string }
        summary: { type: string }
        rows: { type: integer }
        changes:
          type: array
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
              before: {}
              after: {}
        status: { type: string, enum: [pending, applied, cancelled, failed, expired] }
        needsSecondConfirmation: { type: boolean }
        error: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    BotConversation:
      type: object
      required: [id, title, messages, proposals]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        messages: { type: array, items: { $ref: '#/components/schemas/BotMessage' } }
        proposals: { type: array, items: { $ref: '#/components/schemas/BotProposal' } }
    OrganizationLocation:
      type: object
      required: [version, enabled, latitude, longitude, radiusM, windowBeforeMin, windowAfterMin]
      properties:
        version: { type: integer, description: "The organization's version; send as If-Match." }
        enabled: { type: boolean }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        radiusM: { type: integer, description: 'Geofence radius in metres (default 100).' }
        windowBeforeMin:
          { type: integer, description: 'Prompt from this many minutes before a planned start.' }
        windowAfterMin: { type: integer, description: 'Until this many minutes after it.' }
    ArrivalCheck:
      type: object
      required: [prompt, reason, message, plannedStart]
      properties:
        prompt: { type: boolean }
        reason:
          type: string
          enum:
            [planned_shift, off_for_organization, off_for_employee, already_on_shift, no_shift_now]
        message: { type: [string, 'null'], example: 'You came to work. Start shift' }
        plannedStart: { type: [string, 'null'], format: date-time }
    Allocation:
      type: object
      additionalProperties: false
      required: [deliveryId, amount]
      properties:
        deliveryId: { type: string, format: uuid }
        amount: { type: integer, minimum: 1 }
    FinanceSummary:
      type: object
      required: [from, to, contractors, totals]
      properties:
        from: { type: [string, 'null'], format: date }
        to: { type: [string, 'null'], format: date }
        contractors:
          type: array
          items:
            type: object
            required: [contractor, deliveredValue, approvedPayments, pendingPayments, outstanding]
            properties:
              contractor: { $ref: '#/components/schemas/PersonRef' }
              deliveredValue:
                { type: integer, description: 'In the range, from delivered quantities.' }
              approvedPayments:
                { type: integer, description: 'Approved payments dated in the range.' }
              pendingPayments:
                { type: integer, description: 'Waiting for review; not in the balance.' }
              outstanding:
                { type: integer, description: 'Now: delivered value minus approved payments.' }
        totals:
          type: object
          required: [deliveredValue, approvedPayments, pendingPayments, outstanding]
          properties:
            deliveredValue: { type: integer }
            approvedPayments: { type: integer }
            pendingPayments: { type: integer }
            outstanding: { type: integer }
    FinanceDelivery:
      type: object
      required: [id, deliveryDate, status, totalValue, paidValue, remainingValue, lines]
      properties:
        contractor: { $ref: '#/components/schemas/PersonRef' }
        id: { type: string, format: uuid }
        deliveryDate: { type: string, format: date }
        status: { type: string }
        totalValue: { type: integer }
        paidValue: { type: integer }
        remainingValue: { type: integer }
        lines:
          type: array
          items:
            type: object
            required: [productName, deliveredQuantity, unitPrice, lineValue]
            properties:
              productName: { type: string }
              deliveredQuantity: { type: integer }
              unitPrice: { type: [integer, 'null'] }
              lineValue: { type: [integer, 'null'] }
    FinanceEvent:
      type: object
      required: [kind, date, id, amount, status, note]
      properties:
        contractor: { $ref: '#/components/schemas/PersonRef' }
        kind: { type: string, enum: [delivery, payment, adjustment] }
        date: { type: string, format: date }
        id: { type: string, format: uuid }
        amount: { type: integer }
        status: { type: string }
        note: { type: [string, 'null'] }
    Payment:
      type: object
      required:
        [
          id,
          provider,
          contractor,
          submittedAmount,
          note,
          proofUrl,
          proofType,
          status,
          approvedAmount,
          paymentDate,
          rejectionReason,
          reversedReason,
          reviewedAt,
          allocations,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/PersonRef' }
        contractor: { $ref: '#/components/schemas/PersonRef' }
        submittedAmount: { type: integer }
        note: { type: [string, 'null'] }
        proofUrl: { type: string, description: Short-lived link. }
        proofType: { type: string }
        status: { type: string, enum: [pending, approved, rejected, cancelled, reversed] }
        approvedAmount: { type: [integer, 'null'] }
        paymentDate: { type: [string, 'null'], format: date }
        rejectionReason: { type: [string, 'null'] }
        reversedReason: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        allocations:
          type: array
          items:
            type: object
            required: [deliveryId, deliveryDate, amount]
            properties:
              deliveryId: { type: string, format: uuid }
              deliveryDate: { type: [string, 'null'], format: date }
              amount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    SettlementPeriod:
      type: object
      required:
        [
          id,
          startDate,
          endDate,
          kind,
          status,
          openingBalance,
          deliveredValue,
          approvedPayments,
          adjustments,
          closingBalance,
          closedAt,
        ]
      properties:
        contractor: { $ref: '#/components/schemas/PersonRef' }
        id: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        kind: { type: string, enum: [mid_month, month_end, custom] }
        status: { type: string, enum: [open, closed] }
        openingBalance:
          { type: integer, description: "The previous period's closing balance (SET-2)." }
        deliveredValue: { type: integer }
        approvedPayments: { type: integer }
        adjustments:
          { type: integer, description: 'Corrections to closed periods, counted here (rule 9).' }
        closingBalance: { type: integer }
        closedAt: { type: [string, 'null'], format: date-time }
    SettlementReport:
      allOf:
        - $ref: '#/components/schemas/SettlementPeriod'
        - type: object
          required: [items]
          properties:
            items:
              type: object
              description: The line items; for a closed period, exactly as stored when it was closed.
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 200 }
        currentPassword:
          type: string
          description: Required to change the email or password of an account that has a password. A changed password ends every session.
        locale: { type: string, enum: [en, ko, uz] }
        preferences: { $ref: '#/components/schemas/Preferences' }

    OrganizationSummary:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/OrganizationType' }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/OrganizationType' }
        timezone:
          type: string
          description: IANA time zone; defaults to Asia/Seoul.
          example: Asia/Seoul
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CreatedOrganization:
      type: object
      required: [organization, membership]
      properties:
        organization:
          type: object
          required: [id, name, type, timezone, version]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            type: { $ref: '#/components/schemas/OrganizationType' }
            timezone: { type: string }
            version: { type: integer }
        membership:
          type: object
          required: [id, role, status]
          properties:
            id: { type: string, format: uuid }
            role: { $ref: '#/components/schemas/MembershipRole' }
            status: { $ref: '#/components/schemas/MembershipStatus' }

    OwnApplication:
      type: object
      required: [id, kind, status, organization, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [employee, contractor] }
        status: { type: string, enum: [pending, approved, rejected, active] }
        organization: { $ref: '#/components/schemas/OrganizationSummary' }
        createdAt: { type: string, format: date-time }
    Application:
      type: object
      required: [id, kind, status, applicant, contractor, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [employee, contractor] }
        status:
          type: string
          description: Employee applications become `active` or `rejected`; contractor applications `approved` or `rejected`.
          enum: [pending, active, approved, rejected]
        applicant:
          description: The person who applied (for a contractor, the admin who applied for it).
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        contractor:
          description: The contractor organization; empty for employee applications.
          oneOf:
            - $ref: '#/components/schemas/OrganizationSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }

    EmployeeAccessArea:
      type: string
      enum:
        [allShifts, ordersDueNext, ordersHistory, deliveries, outputAll, ingredientPrices, finance]
    EmployeeAccess:
      type: object
      required: [version, areas]
      properties:
        version:
          type: integer
          description: The organization's version; send as If-Match when updating.
        areas:
          type: array
          items:
            type: object
            required: [key, label, enabled, defaultEnabled]
            properties:
              key: { $ref: '#/components/schemas/EmployeeAccessArea' }
              label: { type: string }
              enabled: { type: boolean }
              defaultEnabled: { type: boolean }
    UpdateEmployeeAccessRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        allShifts: { type: boolean }
        ordersDueNext: { type: boolean }
        ordersHistory: { type: boolean }
        deliveries: { type: boolean }
        outputAll: { type: boolean }
        ingredientPrices: { type: boolean }
        finance: { type: boolean }

    PackUnit:
      type: string
      enum: [g, kg, pc, L, mL]
    OrderSchedule:
      description: When the ingredient must be ordered each week (open question 14).
      type: object
      required: [weekday, time]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '18:00' }
    Ingredient:
      type: object
      required:
        [
          id,
          name,
          source,
          orderSchedule,
          packQuantity,
          packUnit,
          wasteQuantity,
          usableQuantity,
          responsibleEmployees,
          isMyResponsibility,
          dueToday,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source: { type: string, description: Where it is bought. }
        orderSchedule:
          oneOf:
            - $ref: '#/components/schemas/OrderSchedule'
            - type: 'null'
        packQuantity: { type: number, description: How much one pack contains, in packUnit. }
        packUnit: { $ref: '#/components/schemas/PackUnit' }
        wasteQuantity:
          type: number
          description: How much of one pack is thrown away (peel, trimmings), in packUnit (decided 2026-11-28).
        usableQuantity:
          type: number
          description: packQuantity minus wasteQuantity; product costs use this.
        packPrice:
          type: [integer, 'null']
          description: Current price per pack in whole won. Only for callers allowed to read prices.
        unitPrice:
          type: [number, 'null']
          description: packPrice divided by usableQuantity (the cost of one usable unit), rounded to 0.01 won. Only with packPrice.
        priceEffectiveFrom:
          type: [string, 'null']
          format: date-time
        responsibleEmployees:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        isMyResponsibility: { type: boolean }
        dueToday:
          type: boolean
          description: Today, in the organization's time zone, is this ingredient's ordering day.
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateIngredientRequest:
      type: object
      additionalProperties: false
      required: [name, source, packQuantity, packUnit]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        source: { type: string, minLength: 1, maxLength: 200 }
        orderSchedule:
          oneOf:
            - $ref: '#/components/schemas/OrderSchedule'
            - type: 'null'
        packQuantity: { type: number, exclusiveMinimum: 0 }
        packUnit: { $ref: '#/components/schemas/PackUnit' }
        wasteQuantity:
          type: number
          minimum: 0
          description: How much of one pack is thrown away, in packUnit; less than packQuantity (decided 2026-11-28).
        packPrice: { type: integer, minimum: 0, description: Whole won per pack. }
    UpdateIngredientRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        source: { type: string, minLength: 1, maxLength: 200 }
        orderSchedule:
          oneOf:
            - $ref: '#/components/schemas/OrderSchedule'
            - type: 'null'
        packQuantity: { type: number, exclusiveMinimum: 0 }
        packUnit: { $ref: '#/components/schemas/PackUnit' }
        wasteQuantity:
          type: number
          minimum: 0
          description: How much of one pack is thrown away, in packUnit; less than packQuantity (decided 2026-11-28).

    ProductIngredientInput:
      type: object
      additionalProperties: false
      required: [ingredientId]
      properties:
        ingredientId: { type: string, format: uuid }
        quantity:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 1000000
          description: How much one batch needs, in `unit` (decided 2026-12-01). Optional; null clears it; left out keeps the amount already saved.
        unit:
          $ref: '#/components/schemas/PackUnit'
          description: Defaults to the ingredient's pack unit; must be the same kind (g or kg, mL or L, pc).
    Product:
      type: object
      required:
        [
          id,
          name,
          imageKey,
          imageUrl,
          minutesPer10,
          available,
          type,
          sortOrder,
          ingredients,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type:
          oneOf:
            - $ref: '#/components/schemas/ProductType'
            - type: 'null'
          description: The product's type, e.g. Meal or Bakery (decided 2026-11-30).
        sortOrder:
          type: integer
          description: Place in the admin's custom order.
        imageKey: { type: string }
        imageUrl: { type: string, description: Short-lived link to the picture. }
        minutesPer10: { type: integer, description: Minutes to prepare 10 units. }
        unitPrice:
          type: [integer, 'null']
          description: 'F-001: current price per unit in won; hidden from employees unless Finance is open to them.'
        available: { type: boolean }
        ingredients:
          type: array
          items:
            type: object
            required: [id, name, quantity, unit, packUnit]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: [number, 'null'], description: Per batch (decided 2026-12-01). }
              unit:
                oneOf:
                  - $ref: '#/components/schemas/PackUnit'
                  - type: 'null'
              packUnit: { $ref: '#/components/schemas/PackUnit' }
              cost:
                type: [integer, 'null']
                description: Admins only. This line's cost at today's ingredient price, whole won; null without an amount or a price.
        batchYield:
          type: [integer, 'null']
          description: How many pieces one batch makes (decided 2026-12-01).
        cost:
          type: object
          description: Admins only (prices.manage). What one batch costs at today's ingredient prices.
          required: [perBatch, perPiece, missing]
          properties:
            perBatch: { type: [integer, 'null'] }
            perPiece: { type: [integer, 'null'], description: Needs batchYield. }
            missing:
              {
                type: integer,
                description: Ingredients without an amount or a price,
                left out of the cost.,
              }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, minutesPer10]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        imageKey:
          type: string
          description: From POST /product-images. Leave out to use a placeholder until a picture is added.
        minutesPer10: { type: integer, minimum: 1, maximum: 10000 }
        ingredients:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/ProductIngredientInput' }
        unitPrice:
          type: integer
          minimum: 0
          maximum: 100000000
          description: Whole won per unit (F-001). Needs prices.manage.
        typeId:
          type: [string, 'null']
          format: uuid
          description: The product's type (from /product-types); null for none.
        batchYield:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000
          description: How many pieces one batch makes.
        available: { type: boolean, default: true }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        imageKey: { type: string }
        minutesPer10: { type: integer, minimum: 1, maximum: 10000 }
        ingredients:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ProductIngredientInput' }
        typeId:
          type: [string, 'null']
          format: uuid
          description: The product's type (from /product-types); null for none.
        batchYield: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        available: { type: boolean }

    BotAccessSwitch:
      type: string
      enum: [decideApplications, manageMembers, manageEmployeeAccess]
    BotAccess:
      type: object
      required: [version, areas]
      properties:
        version:
          type: integer
          description: The organization's version; send as If-Match when updating.
        areas:
          type: array
          items:
            type: object
            required: [key, label, enabled, defaultEnabled]
            properties:
              key: { $ref: '#/components/schemas/BotAccessSwitch' }
              label: { type: string }
              enabled: { type: boolean }
              defaultEnabled: { type: boolean }
    UpdateBotAccessRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        decideApplications: { type: boolean }
        manageMembers: { type: boolean }
        manageEmployeeAccess: { type: boolean }

    ShiftDay:
      type: object
      required: [weekday, startTime, endTime, endsNextDay]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
        startTime: { type: string, example: '22:00' }
        endTime: { type: string, example: '06:00' }
        endsNextDay:
          {
            type: boolean,
            description: 'True for a night shift: it ends on the day after it starts.',
          }
    SalaryAdvance:
      type: object
      required:
        [id, employeeId, amount, paidOn, note, createdById, createdAt, cancelledAt, cancelReason]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        amount: { type: integer, description: Whole won. }
        paidOn: { type: string, format: date, description: The day the money was sent. }
        note: { type: [string, 'null'] }
        createdById: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelReason: { type: [string, 'null'] }
    WorkHoursMonth:
      type: object
      required: [month, from, to, today, timezone, people, totals]
      properties:
        month: { type: string, example: '2026-11' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        today: { type: string, format: date }
        timezone: { type: string }
        people:
          type: array
          items:
            type: object
            required:
              [employee, removedOn, minutes, daysWorked, unfinished, openSince, days, advances]
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              removedOn: { type: [string, 'null'], format: date }
              minutes: { type: integer, description: Finished shifts only. }
              daysWorked: { type: integer }
              unfinished:
                type: integer
                description: Shifts still open or never ended; counted once ended.
              openSince:
                type: array
                description: When each of those shifts started (decided 2026-11-26).
                items: { type: string, format: date-time }
              days:
                type: array
                items:
                  type: object
                  required: [date, minutes, shifts]
                  properties:
                    date: { type: string, format: date }
                    minutes: { type: integer }
                    shifts: { type: integer }
              advances:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer, description: Cancelled advances do not count. }
                  items: { type: array, items: { $ref: '#/components/schemas/SalaryAdvance' } }
              hourlyRate:
                { type: [integer, 'null'], description: Owners only (decided 2026-11-26). }
              laborCost:
                type: [integer, 'null']
                description: Owners only. The month's worked hours at the hourly cost in force each day.
        totals:
          type: object
          required: [minutes, advances]
          properties:
            minutes: { type: integer }
            advances: { type: integer }
    HourlyRate:
      type: object
      required: [employeeId, hourlyRate, effectiveFrom]
      properties:
        employeeId: { type: string, format: uuid }
        hourlyRate: { type: integer, description: Whole won per hour. }
        effectiveFrom: { type: string, format: date-time }
    LatestOutput:
      type: object
      required: [today, employees]
      properties:
        today: { type: string, format: date }
        employees:
          type: array
          items:
            type: object
            required: [employee, date, workedMinutes, output]
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              date:
                { type: [string, 'null'], format: date, description: Null when nothing in 60 days. }
              workedMinutes: { type: integer }
              output:
                oneOf:
                  - $ref: '#/components/schemas/OutputDay'
                  - type: 'null'
    Efficiency:
      type: object
      required:
        [employee, month, from, to, labor, hourlyRate, minutes, products, days, totals, missing]
      properties:
        employee: { $ref: '#/components/schemas/PersonRef' }
        month: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        labor:
          {
            type: boolean,
            description: Whether labor is included (owner,
            and an hourly cost is set).,
          }
        hourlyRate: { type: [integer, 'null'], description: Owners only. }
        minutes: { type: integer, description: Worked minutes (finished shifts). }
        products:
          type: array
          items:
            type: object
            required:
              [
                productId,
                name,
                quantity,
                unitPrice,
                costPerPiece,
                revenue,
                ingredientCost,
                expectedMinutes,
                laborCost,
                contribution,
              ]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: number }
              unitPrice: { type: [integer, 'null'] }
              costPerPiece: { type: [integer, 'null'] }
              revenue: { type: integer }
              ingredientCost: { type: integer }
              expectedMinutes: { type: integer }
              laborCost: { type: [integer, 'null'] }
              contribution: { type: integer }
        days:
          type: array
          items:
            type: object
            required:
              [
                date,
                minutes,
                quantity,
                revenue,
                ingredientCost,
                laborCost,
                contribution,
                perHour,
                products,
              ]
            properties:
              date: { type: string, format: date }
              minutes: { type: integer }
              quantity: { type: number }
              revenue: { type: integer }
              ingredientCost: { type: integer }
              laborCost: { type: [integer, 'null'] }
              contribution: { type: integer }
              perHour: { type: [integer, 'null'], description: Result per hour worked that day. }
              products:
                type: array
                description: What was made that day and what it brought in (decided 2026-11-28).
                items:
                  type: object
                  required:
                    [productId, name, quantity, revenue, ingredientCost, laborCost, contribution]
                  properties:
                    productId: { type: string, format: uuid }
                    name: { type: string }
                    quantity: { type: number }
                    revenue: { type: integer }
                    ingredientCost: { type: integer }
                    laborCost: { type: [integer, 'null'] }
                    contribution: { type: integer }
        totals:
          type: object
          required:
            [quantity, revenue, ingredientCost, laborCost, unassignedLabor, contribution, perHour]
          properties:
            quantity: { type: number }
            revenue: { type: integer }
            ingredientCost: { type: integer }
            laborCost: { type: [integer, 'null'] }
            unassignedLabor:
              type: [integer, 'null']
              description: Labor on days with hours but no output logged.
            contribution: { type: integer }
            perHour: { type: [integer, 'null'] }
        missing:
          type: object
          required: [prices, costs, hourlyRate, daysWithoutHours]
          properties:
            prices: { type: integer, description: Products made without a price. }
            costs: { type: integer, description: Products made without a cost per piece. }
            hourlyRate: { type: boolean, description: An owner looks and no hourly cost is set. }
            daysWithoutHours:
              type: integer
              description: Days with output but no finished shift, so no labor is counted for them.
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Inside an organization, the name its admins gave the person, else their account name (decided 2026-11-29).
        title:
          type: [string, 'null']
          description: The person's title in the organization, where it is shown.
    ShiftPlan:
      type: object
      required: [employee, days]
      properties:
        employee: { $ref: '#/components/schemas/PersonRef' }
        days: { type: array, items: { $ref: '#/components/schemas/ShiftDay' } }
    ShiftPlanResult:
      type: object
      required: [employeeId, days]
      properties:
        employeeId: { type: string, format: uuid }
        days: { type: array, items: { $ref: '#/components/schemas/ShiftDay' } }
    SetShiftPlanRequest:
      type: object
      additionalProperties: false
      required: [employeeId, days]
      properties:
        employeeId: { type: string, format: uuid }
        days:
          type: array
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [weekday, startTime, endTime]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6 }
              startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    PunchRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [start, pause, resume, end] }
    PunchEvent:
      type: object
      required: [id, eventType, occurredAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        eventType: { type: string, enum: [start, pause, end] }
        occurredAt: { type: string, format: date-time }
        source: { type: string, enum: [self, admin] }
        version: { type: integer }
    PlannedShift:
      type: object
      required: [startDate, endDate, startTime, endTime]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: 'The next day for a night shift.' }
        startTime: { type: string }
        endTime: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    PunchCard:
      type: object
      required: [serverTime, status, allowedActions, current, todayPlan]
      properties:
        serverTime: { type: string, format: date-time }
        status: { type: string, enum: [off, working, paused] }
        allowedActions: { type: array, items: { type: string, enum: [start, pause, resume, end] } }
        current:
          oneOf:
            - type: object
              required: [startedAt, workedMinutes, events]
              properties:
                startedAt: { type: string, format: date-time }
                workedMinutes: { type: integer }
                events: { type: array, items: { $ref: '#/components/schemas/PunchEvent' } }
            - type: 'null'
        todayPlan:
          oneOf:
            - $ref: '#/components/schemas/PlannedShift'
            - type: 'null'
    Flag:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [LATE_START, EARLY_END, MISSING_PUNCH, UNPLANNED, NOT_ENDED] }
        minutes: { type: integer }
        message: { type: string }
    TimesheetDay:
      type: object
      required: [date, planned, sessions, workedMinutes, flags]
      properties:
        date:
          { type: string, format: date, description: 'A shift belongs to the date it started on.' }
        planned:
          oneOf:
            - $ref: '#/components/schemas/PlannedShift'
            - type: 'null'
        sessions:
          type: array
          items:
            type: object
            required: [startedAt, endedAt, status, workedMinutes, events]
            properties:
              startedAt: { type: string, format: date-time }
              endedAt: { type: [string, 'null'], format: date-time }
              status: { type: string, enum: [working, paused, ended] }
              workedMinutes: { type: integer }
              events: { type: array, items: { $ref: '#/components/schemas/PunchEvent' } }
        workedMinutes: { type: integer, description: 'Paused time excluded.' }
        flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
    Timesheet:
      type: object
      required: [employee, days]
      properties:
        employee: { $ref: '#/components/schemas/PersonRef' }
        days: { type: array, items: { $ref: '#/components/schemas/TimesheetDay' } }
    ShiftDashboard:
      type: object
      required: [from, to, employees]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        employees:
          type: array
          items:
            type: object
            required: [employee, color, removedOn, days]
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              removedOn:
                type: [string, 'null']
                format: date
                description: Set when the person was removed (decided 2026-11-28); days after it are not shown.
              color:
                { type: integer, description: 'Colour slot 0 to 7; red is never used for people.' }
              days: { type: array, items: { $ref: '#/components/schemas/TimesheetDay' } }
    EditPunchRequest:
      type: object
      additionalProperties: false
      required: [occurredAt]
      properties:
        occurredAt: { type: string, format: date-time }
    AddPunchRequest:
      type: object
      additionalProperties: false
      required: [employeeId, eventType, occurredAt]
      properties:
        employeeId: { type: string, format: uuid }
        eventType: { type: string, enum: [start, pause, end] }
        occurredAt: { type: string, format: date-time }
    PunchChangeRequestInput:
      type: object
      additionalProperties: false
      required: [shiftDate, requestedStart, requestedEnd, reason]
      properties:
        shiftDate: { type: string, format: date }
        requestedStart: { type: string, format: date-time }
        requestedEnd: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PunchChangeRequest:
      type: object
      required: [id, employee, shiftDate, original, requested, reason, status, decidedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        employee: { $ref: '#/components/schemas/PersonRef' }
        shiftDate: { type: string, format: date }
        original:
          type: object
          properties:
            start: { type: [string, 'null'], format: date-time }
            end: { type: [string, 'null'], format: date-time }
        requested:
          type: object
          properties:
            start: { type: [string, 'null'], format: date-time }
            end: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected] }
        decidedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
    Team:
      type: object
      required: [id, name, members, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shared: { type: boolean, description: 'Made by an admin and seen by every member.' }
        members:
          type: array
          items:
            type: object
            required: [id, name, removed]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              removed:
                type: boolean
                description: Removed from the organization (decided 2026-11-28); kept on the team until an admin takes them off, with no share of later output.
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name, memberIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        shared:
          { type: boolean, default: false, description: 'Admins only: a team every member sees.' }
        memberIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        memberIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    PutOutputRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 0 }
              teamId:
                { type: [string, 'null'], format: uuid, description: 'Empty for personal output.' }
        cleaningHours: { type: number, minimum: 0, maximum: 24, multipleOf: 0.25, default: 0 }
    OutputDay:
      type: object
      required: [date, personal, team, cleaningHours, creditedQuantity, expectedMinutes]
      properties:
        date: { type: string, format: date }
        personal:
          type: array
          items:
            type: object
            required: [productId, name, quantity, expectedMinutes]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              expectedMinutes: { type: number }
        team:
          type: array
          items:
            type: object
            required: [team, loggedBy, members, productId, name, quantity, creditedQuantity]
            properties:
              team: { $ref: '#/components/schemas/PersonRef' }
              loggedBy: { type: string, format: uuid }
              members: { type: array, items: { $ref: '#/components/schemas/PersonRef' } }
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer, description: 'Counted once for the team.' }
              creditedQuantity: { type: number, description: 'Equal share for each member.' }
        cleaningHours: { type: number }
        creditedQuantity:
          { type: number, description: 'Personal quantity plus equal shares of team lines.' }
        expectedMinutes:
          {
            type: number,
            description: 'Quantity / 10 x minutes per 10, team lines shared equally.',
          }
    OutputHistory:
      type: object
      required: [employee, days]
      properties:
        employee: { $ref: '#/components/schemas/PersonRef' }
        days: { type: array, items: { $ref: '#/components/schemas/OutputDay' } }
    ShiftOutputDashboard:
      type: object
      required: [date, employees, totals]
      properties:
        date: { type: string, format: date }
        employees:
          type: array
          items:
            type: object
            required: [employee, removedOn, workedMinutes, flags, output, onShift, carriedOver]
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              removedOn:
                type: [string, 'null']
                format: date
                description: Set when the person was removed (decided 2026-11-28); days after it are not shown.
              workedMinutes:
                type: integer
                description: Shifts that started on this day (a shift belongs to the day it started).
              onShift: { type: boolean, description: A shift of this day has not ended yet. }
              carriedOver:
                description: >-
                  A shift from the day before that ran past midnight into this day. Its hours are
                  counted on startedOn, not here (decided 2026-11-26).
                oneOf:
                  - type: object
                    required: [startedOn, minutes, ongoing]
                    properties:
                      startedOn: { type: string, format: date }
                      minutes: { type: integer }
                      ongoing: { type: boolean }
                  - type: 'null'
              flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
              output: { $ref: '#/components/schemas/OutputDay' }
        totals:
          type: array
          items:
            type: object
            required: [productId, name, quantity]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
    Task:
      type: object
      required:
        [
          id,
          type,
          title,
          description,
          assignee,
          assignees,
          forAll,
          createdBy,
          dueDate,
          recurringTaskId,
          status,
          completedAt,
          completedBy,
          photos,
          ingredientOrderId,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [general, ingredient_order] }
        title: { type: string }
        description: { type: [string, 'null'] }
        assignee:
          description: Empty for ingredient-order tasks, which go to the admins.
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        assignees:
          type: array
          description: Everyone the task is for (empty when it is for everyone or for the admins).
          items: { $ref: '#/components/schemas/PersonRef' }
        forAll: { type: boolean, description: For every employee, including people who join later. }
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        dueDate: { type: [string, 'null'], format: date }
        recurringTaskId:
          description: Set when a repeating task made this task (phase 3).
          type: [string, 'null']
          format: uuid
        status: { type: string, enum: [open, done] }
        completedAt: { type: [string, 'null'], format: date-time }
        completedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        photos:
          type: array
          items:
            type: object
            required: [id, url, takenAt]
            properties:
              id: { type: string, format: uuid }
              url: { type: string, description: Short-lived link. }
              takenAt: { type: string, format: date-time, description: Recorded by the server. }
        ingredientOrderId: { type: [string, 'null'], format: uuid }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, dueDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        assigneeId: { type: string, format: uuid, description: One employee. }
        assigneeIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
          description: Several employees; any of them finishes the task for all.
        forAll:
          type: boolean
          description: Every employee, including people who join later. Give only one of assigneeId, assigneeIds or forAll.
        dueDate: { type: string, format: date }
    RecurringTask:
      type: object
      required:
        [
          id,
          title,
          description,
          assignee,
          assignees,
          forAll,
          frequency,
          weekdays,
          dayOfMonth,
          startDate,
          endDate,
          active,
          lastMade,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        assignees:
          type: array
          items: { $ref: '#/components/schemas/PersonRef' }
        forAll: { type: boolean }
        frequency: { type: string, enum: [daily, weekly, monthly] }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        dayOfMonth: { type: [integer, 'null'], minimum: 1, maximum: 31 }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        active: { type: boolean }
        lastMade:
          oneOf:
            - type: object
              required: [date, status]
              properties:
                date: { type: string, format: date }
                status: { type: string, enum: [open, done] }
            - type: 'null'
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateRecurringTaskRequest:
      type: object
      additionalProperties: false
      required: [title, frequency, startDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        assigneeId: { type: string, format: uuid, description: One employee. }
        assigneeIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
          description: Several employees; each made task is shared by them.
        forAll:
          type: boolean
          description: Every employee, including people who join later. Give only one of assigneeId, assigneeIds or forAll.
        frequency: { type: string, enum: [daily, weekly, monthly] }
        weekdays: { type: array, maxItems: 7, items: { type: integer, minimum: 0, maximum: 6 } }
        dayOfMonth: { type: [integer, 'null'], minimum: 1, maximum: 31 }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
    UpdateRecurringTaskRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        assigneeId: { type: string, format: uuid, description: One employee. }
        assigneeIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
          description: Several employees; each made task is shared by them.
        forAll:
          type: boolean
          description: Every employee, including people who join later. Give only one of assigneeId, assigneeIds or forAll.
        frequency: { type: string, enum: [daily, weekly, monthly] }
        weekdays: { type: array, maxItems: 7, items: { type: integer, minimum: 0, maximum: 6 } }
        dayOfMonth: { type: [integer, 'null'], minimum: 1, maximum: 31 }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        active: { type: boolean }
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        assigneeId: { type: string, format: uuid, description: One employee. }
        assigneeIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
          description: Several employees; any of them finishes the task for all.
        forAll:
          type: boolean
          description: Every employee, including people who join later. Give only one of assigneeId, assigneeIds or forAll.
        dueDate: { type: string, format: date }
    CaptureToken:
      type: object
      required: [captureToken, expiresAt]
      properties:
        captureToken: { type: string }
        expiresAt: { type: string, format: date-time }
    CreateIngredientOrderRequest:
      type: object
      additionalProperties: false
      required: [ingredientId, quantity]
      properties:
        ingredientId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, description: Number of packs. }
        note: { type: string, maxLength: 500 }
    IngredientOrder:
      type: object
      required:
        [
          id,
          ingredient,
          quantity,
          note,
          status,
          requestedBy,
          fulfilledBy,
          fulfilledAt,
          checkedBy,
          checkedAt,
          taskId,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        ingredient:
          type: object
          required: [id, name, source, packQuantity, packUnit]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            source: { type: string }
            packQuantity: { type: number }
            packUnit: { $ref: '#/components/schemas/PackUnit' }
        quantity: { type: integer, description: Number of packs. }
        packPrice:
          {
            type: [integer, 'null'],
            description: 'Won per pack when ordered; only for callers allowed to read prices.',
          }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [requested, fulfilled, checked] }
        requestedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        fulfilledBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        fulfilledAt: { type: [string, 'null'], format: date-time }
        checkedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        checkedAt: { type: [string, 'null'], format: date-time }
        taskId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, organizationId, type, payload, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: [string, 'null'], format: uuid }
        type: { type: string, example: task.assigned }
        payload: { type: object }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    CatalogItem:
      type: object
      required: [id, name, imageUrl, type, sortOrder, unitPrice]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        imageUrl: { type: string }
        type:
          oneOf:
            - $ref: '#/components/schemas/ProductType'
            - type: 'null'
          description: The product's type, e.g. Meal or Bakery (decided 2026-11-30).
        sortOrder:
          type: integer
          description: Place in the admin's custom order.
        unitPrice:
          { type: [integer, 'null'], description: 'F-001: price per unit delivered, in won.' }
    DefaultDeliveryDate:
      type: object
      required: [date, askIfToday, timezone]
      properties:
        date: { type: string, format: date }
        askIfToday:
          {
            type: boolean,
            description: 'True before 10:00 provider time: confirm the order is for today.',
          }
        timezone: { type: string }
    OrderLineInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
    PlaceOrderRequest:
      type: object
      additionalProperties: false
      required: [providerId, deliveryDate, lines]
      properties:
        providerId: { type: string, format: uuid }
        deliveryDate: { type: string, format: date }
        lines:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/OrderLineInput' },
          }
    SetOrderLinesRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OrderLineInput' } }
    OrderChangeRequestInput:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OrderLineInput' } }
        note: { type: string, maxLength: 500 }
    Order:
      type: object
      required:
        [
          id,
          provider,
          contractor,
          deliveryDate,
          status,
          placedAt,
          lines,
          openChangeRequestIds,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/PersonRef' }
        contractor: { $ref: '#/components/schemas/PersonRef' }
        deliveryDate: { type: string, format: date }
        status: { type: string, enum: [placed, cancelled] }
        placedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [productId, productName, quantity]
            properties:
              productId: { type: string, format: uuid }
              productName: { type: string, description: 'Copied when ordered.' }
              quantity: { type: integer }
        openChangeRequestIds: { type: array, items: { type: string, format: uuid } }
        approxTime:
          description: 'The standing approximate delivery time for this contractor (DTM-4).'
          oneOf:
            - $ref: '#/components/schemas/ApproxTime'
            - type: 'null'
        version: { type: integer }
        value:
          description: >-
            Decided 2026-11-30: what the order is worth. Only in the provider's order list, for
            people who may see finance; null for a cancelled order.
          oneOf:
            - $ref: '#/components/schemas/OrderValue'
            - type: 'null'
    OrderValue:
      type: object
      description: >-
        An estimate (ordered quantity at today's price) until the delivery is completed, then the
        real amount the delivery recorded (delivered quantity at the price copied then, F-001).
      required: [kind, amount, unpriced, lines]
      properties:
        kind: { type: string, enum: [estimate, actual] }
        amount: { type: integer, description: Whole won; unpriced products count as 0. }
        unpriced: { type: integer, description: Products in the order without a price. }
        lines:
          type: array
          items:
            type: object
            required: [productId, productName, quantity, unitPrice, amount]
            properties:
              productId: { type: string, format: uuid }
              productName: { type: string }
              quantity: { type: integer, description: Ordered (estimate) or delivered (actual). }
              unitPrice: { type: [integer, 'null'] }
              amount: { type: [integer, 'null'] }
    OrderTotals:
      type: object
      required: [deliveryDate, items]
      properties:
        deliveryDate: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            required: [productId, name, quantity]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
    OrderChangeRequest:
      type: object
      required: [id, orderId, contractor, deliveryDate, note, status, items, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        contractor: { $ref: '#/components/schemas/PersonRef' }
        deliveryDate: { type: string, format: date }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [open, closed] }
        items:
          type: array
          items:
            type: object
            required:
              [
                id,
                productId,
                productName,
                fromQuantity,
                toQuantity,
                kind,
                status,
                needsAdmin,
                decidedAt,
              ]
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              productName: { type: string }
              fromQuantity: { type: integer }
              toQuantity: { type: integer }
              kind: { type: string, enum: [add, increase, decrease, remove] }
              status: { type: string, enum: [pending, accepted, rejected] }
              needsAdmin: { type: boolean, description: 'True for decreases and removals.' }
              decidedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ApproxTime:
      type: object
      required: [start, end]
      properties:
        start: { type: string, example: '14:00' }
        end: { type: string, example: '15:00' }
    ApproxTimeRequest:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    ApproxTimeResult:
      type: object
      required: [contractor, approxTime]
      properties:
        contractor: { type: object, properties: { id: { type: string, format: uuid } } }
        approxTime: { $ref: '#/components/schemas/ApproxTime' }
    ContractorWithTime:
      type: object
      required: [contractor, approxTime]
      properties:
        contractor: { $ref: '#/components/schemas/PersonRef' }
        approxTime:
          oneOf:
            - $ref: '#/components/schemas/ApproxTime'
            - type: 'null'
    Delivery:
      type: object
      required:
        [
          id,
          provider,
          contractor,
          deliveryDate,
          window,
          status,
          lines,
          pendingChange,
          completedAt,
          confirmedAt,
          version,
        ]
      properties:
        id:
          {
            type: [string, 'null'],
            format: uuid,
            description: 'Empty for a draft that was not saved yet.',
          }
        provider:
          {
            type: object,
            properties: { id: { type: string, format: uuid }, name: { type: string } },
          }
        contractor:
          {
            type: object,
            properties: { id: { type: string, format: uuid }, name: { type: string } },
          }
        deliveryDate: { type: string, format: date }
        window:
          description: 'The approximate delivery time copied when the delivery was created (DTM-1).'
          oneOf:
            - type: object
              properties:
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
                startTime: { type: string }
                endTime: { type: string }
            - type: 'null'
        status: { type: string, enum: [not_started, draft, completed, confirmed, change_requested] }
        lines:
          type: array
          items:
            type: object
            required:
              [productId, productName, orderedQuantity, deliveredQuantity, difference, isUnordered]
            properties:
              productId: { type: string, format: uuid }
              productName: { type: string }
              orderedQuantity: { type: integer }
              deliveredQuantity: { type: integer }
              difference: { type: integer, description: 'Delivered minus ordered.' }
              isUnordered: { type: boolean }
              unitPrice:
                {
                  type: [integer, 'null'],
                  description: 'F-001: copied when completed; only for those who see finance.',
                }
              lineValue: { type: [integer, 'null'] }
        totalValue:
          {
            type: [integer, 'null'],
            description: 'F-001: set when completed; only for those who see finance.',
          }
        paidValue: { type: integer }
        remainingValue: { type: [integer, 'null'] }
        pendingChange:
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                lines: { type: array, items: { $ref: '#/components/schemas/DeliveredLine' } }
                reason: { type: [string, 'null'] }
                createdAt: { type: string, format: date-time }
            - type: 'null'
        completedAt: { type: [string, 'null'], format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    DeliveredLine:
      type: object
      additionalProperties: false
      required: [productId, deliveredQuantity]
      properties:
        productId: { type: string, format: uuid }
        deliveredQuantity: { type: integer, minimum: 0 }
    SaveDeliveryRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/DeliveredLine' } }
    DeliveryChangeRequest:
      type: object
      additionalProperties: false
      required: [lines, reason]
      properties:
        lines:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/DeliveredLine' },
          }
        reason: { type: string, minLength: 1, maxLength: 500 }
    DueNextOrder:
      type: object
      required: [orderId, contractor, deliveryDate, approxTime, deliveryStatus, lines, amount]
      properties:
        orderId: { type: string, format: uuid }
        contractor: { $ref: '#/components/schemas/PersonRef' }
        deliveryDate: { type: string, format: date }
        approxTime:
          oneOf:
            - $ref: '#/components/schemas/ApproxTime'
            - type: 'null'
        deliveryStatus: { type: string, enum: [not_started, draft] }
        lines:
          type: array
          items:
            type: object
            required:
              [
                lineId,
                productId,
                productName,
                sortOrder,
                typeName,
                quantity,
                madeQuantity,
                unitPrice,
                amount,
              ]
            properties:
              lineId: { type: string, format: uuid }
              madeQuantity: { type: integer }
              productId: { type: string, format: uuid }
              productName: { type: string }
              sortOrder: { type: integer }
              typeName: { type: [string, 'null'] }
              quantity: { type: integer }
              unitPrice:
                type: [integer, 'null']
                description: Today's price; null without finance access or without a price.
              amount:
                type: [integer, 'null']
                description: Estimated value, quantity times today's price (decided 2026-11-30).
        amount:
          type: [integer, 'null']
          description: Estimated value of the order; null without finance access.
    ProductTotal:
      type: object
      required:
        [
          productId,
          productName,
          sortOrder,
          typeName,
          quantity,
          madeQuantity,
          done,
          unitPrice,
          amount,
        ]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        sortOrder:
          type: integer
          description: Place in the admin's custom order (decided 2026-11-30).
        typeName: { type: [string, 'null'], description: The product's type. }
        quantity: { type: integer }
        madeQuantity: { type: integer }
        done: { type: boolean }
        unitPrice: { type: [integer, 'null'], description: Today's price. }
        amount:
          type: [integer, 'null']
          description: Estimated value; null without finance access or without a price.
    DueNextOrders:
      type: object
      required: [orders, totals, amount, unpriced]
      properties:
        orders: { type: array, items: { $ref: '#/components/schemas/DueNextOrder' } }
        totals: { type: array, items: { $ref: '#/components/schemas/ProductTotal' } }
        amount:
          type: [integer, 'null']
          description: >-
            Estimated value of all orders due next (decided 2026-11-30); null without finance
            access. The delivery records the real amount when it is completed.
        unpriced: { type: integer, description: Products due without a price. }
        byEmployee:
          description: >-
            Only on the full board: the estimated value of each person's assigned products. A
            shared product counts in full for each person. Empty without finance access.
          type: array
          items:
            type: object
            required: [employee, amount]
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              amount: { type: integer }
    EmployeeDueNextOrders:
      type: object
      required: [employee, orders, totals, amount, unpriced]
      properties:
        employee: { $ref: '#/components/schemas/PersonRef' }
        orders: { type: array, items: { $ref: '#/components/schemas/DueNextOrder' } }
        totals: { type: array, items: { $ref: '#/components/schemas/ProductTotal' } }
        amount: { type: [integer, 'null'], description: Estimated value of these products. }
        unpriced: { type: integer }
    TodayDashboard:
      type: object
      required:
        [today, onShift, flags, tasks, deliveriesToday, waiting, outputTotals, ordersDueNext]
      properties:
        today: { type: string, format: date }
        onShift:
          type: array
          items:
            type: object
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              status: { type: string, enum: [working, paused] }
              startedAt: { type: string, format: date-time }
              workedMinutes: { type: integer }
        flags:
          type: array
          items:
            type: object
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
        tasks:
          type: object
          properties:
            due: { type: array, items: { type: object } }
            doneLast24h: { type: integer }
        deliveriesToday: { type: array, items: { type: object } }
        waiting:
          type: object
          properties:
            applications: { type: integer }
            punchChangeRequests: { type: integer }
            orderChangeRequests: { type: integer }
            deliveryChangeRequests: { type: integer }
            ingredientOrders: { type: integer }
        outputTotals: { type: array, items: { type: object } }
        ordersDueNext: { $ref: '#/components/schemas/DueNextOrders' }
    EmployeeHome:
      type: object
      required: [today, punchCard, output, tasks, myOrders, unreadNotifications]
      properties:
        today: { type: string, format: date }
        punchCard: { $ref: '#/components/schemas/PunchCard' }
        output: { $ref: '#/components/schemas/OutputDay' }
        tasks: { type: array, items: { type: object } }
        myOrders:
          description: Empty when the admin has closed Orders due next to employees.
          oneOf:
            - $ref: '#/components/schemas/EmployeeDueNextOrders'
            - type: 'null'
        unreadNotifications: { type: integer }
    MarkMadeRequest:
      type: object
      additionalProperties: false
      required: [productId, made]
      properties:
        productId: { type: string, format: uuid }
        contractorId: { type: string, format: uuid }
        made: { type: boolean }
    ProductType:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Preferences:
      type: object
      properties:
        productSort:
          type: string
          enum: [custom, name, type]
          description: "How product lists are sorted: the admin's custom order (default), A to Z, or by type (decided 2026-11-30)."
        ordersView:
          type: string
          enum: [list, matrix, products]
          description: 'How the person sees orders; stays until they change it. Default products.'
        arrivalPrompt:
          type: boolean
          description: 'Spec section 9: show "You came to work. Start shift" on arrival. Default on.'
    Member:
      type: object
      required:
        [
          id,
          role,
          status,
          owner,
          worksShifts,
          removedAt,
          displayName,
          title,
          version,
          user,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Membership id.
        role: { $ref: '#/components/schemas/MembershipRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        owner:
          type: boolean
          description: An owner of the organization; owners alone change who is an admin. Ownership can be shared.
        worksShifts:
          type: boolean
          description: Has a punch card and shows in shift lists (always true for employees).
        removedAt:
          type: [string, 'null']
          format: date-time
          description: When the person was removed (decided 2026-11-28). The removal can be undone for 3 days (decided 2026-11-30).
        ownerGrantedBy:
          type: [string, 'null']
          format: uuid
          description: The owner who made this person an owner; that owner may undo it for 3 days after ownerGrantedAt (decided 2026-11-30).
        ownerGrantedAt: { type: [string, 'null'], format: date-time }
        leftover:
          type: object
          description: >-
            Only when listing removed members (status=removed): what the person still holds for the
            future, which hand-over clears or hands on (decided 2026-11-26). total 0 means done.
          required: [shiftDays, teams, tasks, repeatingTasks, ingredients, products, total]
          properties:
            shiftDays: { type: integer }
            teams: { type: integer }
            tasks: { type: integer }
            repeatingTasks: { type: integer }
            ingredients: { type: integer }
            products: { type: integer }
            total: { type: integer }
        displayName:
          type: [string, 'null']
          description: The name the organization's admins gave the person; shown instead of the account name (user.name) everywhere inside the organization.
        title: { type: [string, 'null'], description: "The person's title here, e.g. Head baker." }
        version:
          type: integer
          description: Send as If-Match when editing.
        user: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
    CreateMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/MembershipRole' }
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/MembershipRole'
          description: Only owners make, demote or remove admins; an owner cannot be demoted or removed.
        worksShifts:
          type: boolean
          description: For admins only; any admin may switch it, for themselves or others.
        displayName:
          type: [string, 'null']
          maxLength: 100
          description: The name shown for the person inside this organization; empty or null clears it. Any admin may set it.
        title:
          type: [string, 'null']
          maxLength: 60
          description: The person's title here; empty or null clears it. Any admin may set it.
        status:
          type: string
          const: removed
