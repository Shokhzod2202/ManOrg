            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IngredientOrder' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingredient-orders/{id}/fulfil:
    post:
      operationId: fulfilIngredientOrder
      summary: 'Mark an ingredient order fulfilled (ING-6)'
      description: 'Requested to fulfilled; records who and when; the requester is notified.'
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngredientOrder' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /ingredient-orders/{id}/check:
    post:
      operationId: checkIngredientOrder
      summary: 'Mark an ingredient order checked (ING-6)'
      description: 'Fulfilled to checked; records who and when and closes its task.'
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngredientOrder' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notifications:
    get:
      operationId: listNotifications
      summary: "The caller's in-app inbox"
      description: 'Newest first, at most 100, across organizations.'
      tags: [notifications]
      x-tenant-scoped: false
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: 'Mark a notification read'
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Marked read.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /providers:
    get:
      operationId: listProviders
      summary: 'Providers that approved the calling contractor'
      tags: [orders]
      x-tenant-scoped: true
      x-tenant-actor: contractor
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationSummary' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalog:
    get:
      operationId: getCatalog
      summary: "A provider's available products (ORD-1)"
      description: 'Only for contractors the provider approved (404 otherwise).'
      tags: [orders]
      x-tenant-scoped: true
      x-tenant-actor: contractor
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: provider_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/default-date:
    get:
      operationId: getDefaultDeliveryDate
      summary: 'The suggested delivery date for a new order'
      description: 'Before 10:00 provider time: today, and the app asks whether the order is for today. From 10:00: the next day. The contractor can change it.'
      tags: [orders]
      x-tenant-scoped: true
      x-tenant-actor: contractor
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: provider_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultDeliveryDate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    post:
      operationId: placeOrder
      summary: 'Place an order (ORD-2)'
      description: "Any date from today on. Ordering for today closes once that day's delivery is completed (409 DELIVERY_DONE). One order per contractor, provider and day (409 ORDER_EXISTS: send a change request). Everyone at the provider is notified."
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listOrders
      summary: 'Orders by delivery date (ORD-4)'
      description: "The provider sees every contractor's orders; a contractor sees its own. Employees need the Monthly orders list switch."
      tags: [orders]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: contractor_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/totals:
    get:
      operationId: getOrderTotals
      summary: 'Totals per product for a delivery date (ORD-4)'
      tags: [orders]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: delivery_date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderTotals' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}:
    get:
      operationId: getOrder
      summary: 'One order'
      tags: [orders]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/lines:
    put:
      operationId: setOrderLines
      summary: 'The provider admin corrects an order'
      description: 'Provider admins and the bot only; an empty list cancels the order. Audited; the contractor is notified.'
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetOrderLinesRequest' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /orders/{id}/change-requests:
    post:
      operationId: requestOrderChange
      summary: 'Ask to change a placed order (ORD-3)'
      description: 'Send the whole new list of lines; an empty list asks to cancel. The order does not change: each product difference becomes an item that people at the provider accept or reject.'
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderChangeRequestInput' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderChangeRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /order-change-requests:
    get:
      operationId: listOrderChangeRequests
      summary: 'Order change requests'
      description: 'Everyone at the provider who sees orders due next; a contractor sees its own.'
      tags: [orders]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, closed], default: open }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderChangeRequest' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /order-change-items/{id}/accept:
    post:
      operationId: acceptOrderChange
      summary: 'Accept one product change'
      description: 'Added products and larger quantities: any employee or admin. Smaller quantities and removals: admins only. Accepting changes the order; audited; the contractor is notified.'
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderChangeRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /order-change-items/{id}/reject:
    post:
      operationId: rejectOrderChange
      summary: 'Reject one product change'
      description: 'Same rules as accepting.'
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderChangeRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /applications:
    get:
      operationId: listApplications
      summary: Pending employee and contractor applications (bakery admin)
      tags: [applications]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Pending applications, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /applications/{id}/approve:
    post:
      operationId: approveApplication
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Approved. An employee gets the Employee role; a contractor may order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /applications/{id}/reject:
    post:
      operationId: rejectApplication
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /members:
    get:
      operationId: listMembers
      summary: Members of the organization (admins)
      tags: [members]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string, enum: [active, removed], default: active }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Members, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createMember
      summary: Add an existing account, e.g. as another admin (ACC-7)
      description: Contractor organizations take admins only.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMemberRequest' }
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /members/{id}:
    patch:
      operationId: updateMember
      summary: Change a member's role or remove them (ACC-7)
      description: Audited. The organization always keeps one active admin. Takes effect on the member's next request.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: true
      description: The organization the request acts in; must be one of the caller's active memberships.
      schema: { type: string, format: uuid }
    OptionalOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `version` of the record being edited.
      schema: { type: string, example: '"3"' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: '`nextCursor` from the previous page.'
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: The request is not valid; `fields` names each problem.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing, expired or wrong credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The caller's role does not allow this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or not in the caller's organization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with the current state (for example VERSION_CONFLICT, ALREADY_IN_ORGANIZATION, LAST_ADMIN).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: The request is valid but breaks a business rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: If-Match is required on this edit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many attempts; wait a minute.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    NextCursor:
      type: [string, 'null']
      format: uuid

    OrganizationType:
      type: string
      enum: [provider, contractor]
      description: A provider sells (a bakery, a cake shop or any producer); a contractor buys.
    MembershipRole:
      type: string
      enum: [admin, employee]
    MembershipStatus:
      type: string
      enum: [pending, active, rejected, removed]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 200 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
    UserSummary:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
    AuthResult:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    Me:
      type: object
      required: [id, name, email, locale, memberships]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        locale: { type: string, enum: [en, ko, uz] }
        memberships:
          type: array
          description: Newest first; includes pending and rejected applications.
          items:
            type: object
            required: [id, role, status, organization]
            properties:
              id: { type: string, format: uuid }
              role: { $ref: '#/components/schemas/MembershipRole' }
              status: { $ref: '#/components/schemas/MembershipStatus' }
              organization: { $ref: '#/components/schemas/OrganizationSummary' }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 200 }
        currentPassword:
          type: string
          description: Required when changing email or password.
        locale: { type: string, enum: [en, ko, uz] }

    OrganizationSummary:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/OrganizationType' }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/OrganizationType' }
        timezone:
          type: string
          description: IANA time zone; defaults to Asia/Seoul.
          example: Asia/Seoul
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CreatedOrganization:
      type: object
      required: [organization, membership]
      properties:
        organization:
          type: object
          required: [id, name, type, timezone, version]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            type: { $ref: '#/components/schemas/OrganizationType' }
            timezone: { type: string }
            version: { type: integer }
        membership:
          type: object
          required: [id, role, status]
          properties:
            id: { type: string, format: uuid }
            role: { $ref: '#/components/schemas/MembershipRole' }
            status: { $ref: '#/components/schemas/MembershipStatus' }

    OwnApplication:
      type: object
      required: [id, kind, status, organization, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [employee, contractor] }
        status: { type: string, enum: [pending, approved, rejected, active] }
        organization: { $ref: '#/components/schemas/OrganizationSummary' }
        createdAt: { type: string, format: date-time }
    Application:
      type: object
      required: [id, kind, status, applicant, contractor, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [employee, contractor] }
        status:
          type: string
          description: Employee applications become `active` or `rejected`; contractor applications `approved` or `rejected`.
          enum: [pending, active, approved, rejected]
        applicant:
          description: The person who applied (for a contractor, the admin who applied for it).
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        contractor:
          description: The contractor organization; empty for employee applications.
          oneOf:
            - $ref: '#/components/schemas/OrganizationSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }

    EmployeeAccessArea:
      type: string
      enum:
        [allShifts, ordersDueNext, ordersHistory, deliveries, outputAll, ingredientPrices, finance]
    EmployeeAccess:
      type: object
      required: [version, areas]
      properties:
        version:
          type: integer
          description: The organization's version; send as If-Match when updating.
        areas:
          type: array
          items:
            type: object
            required: [key, label, enabled, defaultEnabled]
            properties:
              key: { $ref: '#/components/schemas/EmployeeAccessArea' }
              label: { type: string }
              enabled: { type: boolean }
              defaultEnabled: { type: boolean }
    UpdateEmployeeAccessRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        allShifts: { type: boolean }
        ordersDueNext: { type: boolean }
        ordersHistory: { type: boolean }
        deliveries: { type: boolean }
        outputAll: { type: boolean }
        ingredientPrices: { type: boolean }
        finance: { type: boolean }

    PackUnit:
      type: string
      enum: [g, kg, pc, L, mL]
    OrderSchedule:
      description: When the ingredient must be ordered each week (open question 14).
      type: object
      required: [weekday, time]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '18:00' }
    Ingredient:
      type: object
      required:
        [
          id,
          name,
          source,
          orderSchedule,
          packQuantity,
          packUnit,
          responsibleEmployees,
          isMyResponsibility,
          dueToday,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source: { type: string, description: Where it is bought. }
        orderSchedule:
          oneOf:
            - $ref: '#/components/schemas/OrderSchedule'
            - type: 'null'
        packQuantity: { type: number, description: How much one pack contains, in packUnit. }
        packUnit: { $ref: '#/components/schemas/PackUnit' }
        packPrice:
          type: [integer, 'null']
          description: Current price per pack in whole won. Only for callers allowed to read prices.
        unitPrice:
          type: [number, 'null']
          description: packPrice divided by packQuantity, rounded to 0.01 won. Only with packPrice.
        priceEffectiveFrom:
          type: [string, 'null']
          format: date-time
        responsibleEmployees:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        isMyResponsibility: { type: boolean }
        dueToday:
          type: boolean
          description: Today, in the organization's time zone, is this ingredient's ordering day.
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateIngredientRequest:
      type: object
      additionalProperties: false
      required: [name, source, packQuantity, packUnit]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        source: { type: string, minLength: 1, maxLength: 200 }
        orderSchedule:
          oneOf:
            - $ref: '#/components/schemas/OrderSchedule'
            - type: 'null'
        packQuantity: { type: number, exclusiveMinimum: 0 }
        packUnit: { $ref: '#/components/schemas/PackUnit' }
        packPrice: { type: integer, minimum: 0, description: Whole won per pack. }
    UpdateIngredientRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        source: { type: string, minLength: 1, maxLength: 200 }
        orderSchedule:
          oneOf:
            - $ref: '#/components/schemas/OrderSchedule'
            - type: 'null'
        packQuantity: { type: number, exclusiveMinimum: 0 }
        packUnit: { $ref: '#/components/schemas/PackUnit' }

    ProductIngredientInput:
      type: object
      additionalProperties: false
      required: [ingredientId]
      properties:
        ingredientId: { type: string, format: uuid }
        quantityPer10:
          type: number
          exclusiveMinimum: 0
          description: Optional amount for 10 units, in the ingredient's pack unit (assumption, spec section 7).
    Product:
      type: object
      required:
        [id, name, imageKey, imageUrl, minutesPer10, available, ingredients, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        imageKey: { type: string }
        imageUrl: { type: string, description: Short-lived link to the picture. }
        minutesPer10: { type: integer, description: Minutes to prepare 10 units. }
        available: { type: boolean }
        ingredients:
          type: array
          items:
            type: object
            required: [id, name, quantityPer10]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              quantityPer10: { type: [number, 'null'] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, imageKey, minutesPer10, ingredients]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        imageKey: { type: string }
        minutesPer10: { type: integer, minimum: 1, maximum: 10000 }
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ProductIngredientInput' }
        available: { type: boolean, default: true }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        imageKey: { type: string }
        minutesPer10: { type: integer, minimum: 1, maximum: 10000 }
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ProductIngredientInput' }
        available: { type: boolean }

    BotAccessSwitch:
      type: string
      enum: [decideApplications, manageMembers, manageEmployeeAccess]
    BotAccess:
      type: object
      required: [version, areas]
      properties:
        version:
          type: integer
          description: The organization's version; send as If-Match when updating.
        areas:
          type: array
          items:
            type: object
            required: [key, label, enabled, defaultEnabled]
            properties:
              key: { $ref: '#/components/schemas/BotAccessSwitch' }
              label: { type: string }
              enabled: { type: boolean }
              defaultEnabled: { type: boolean }
    UpdateBotAccessRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        decideApplications: { type: boolean }
        manageMembers: { type: boolean }
        manageEmployeeAccess: { type: boolean }

    ShiftDay:
      type: object
      required: [weekday, startTime, endTime, endsNextDay]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
        startTime: { type: string, example: '22:00' }
        endTime: { type: string, example: '06:00' }
        endsNextDay:
          {
            type: boolean,
            description: 'True for a night shift: it ends on the day after it starts.',
          }
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ShiftPlan:
      type: object
      required: [employee, days]
      properties:
        employee: { $ref: '#/components/schemas/PersonRef' }
        days: { type: array, items: { $ref: '#/components/schemas/ShiftDay' } }
    ShiftPlanResult:
      type: object
      required: [employeeId, days]
      properties:
        employeeId: { type: string, format: uuid }
        days: { type: array, items: { $ref: '#/components/schemas/ShiftDay' } }
    SetShiftPlanRequest:
      type: object
      additionalProperties: false
      required: [employeeId, days]
      properties:
        employeeId: { type: string, format: uuid }
        days:
          type: array
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [weekday, startTime, endTime]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6 }
              startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    PunchRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [start, pause, resume, end] }
    PunchEvent:
      type: object
      required: [id, eventType, occurredAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        eventType: { type: string, enum: [start, pause, end] }
        occurredAt: { type: string, format: date-time }
        source: { type: string, enum: [self, admin] }
        version: { type: integer }
    PlannedShift:
      type: object
      required: [startDate, endDate, startTime, endTime]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: 'The next day for a night shift.' }
        startTime: { type: string }
        endTime: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    PunchCard:
      type: object
      required: [serverTime, status, allowedActions, current, todayPlan]
      properties:
        serverTime: { type: string, format: date-time }
        status: { type: string, enum: [off, working, paused] }
        allowedActions: { type: array, items: { type: string, enum: [start, pause, resume, end] } }
        current:
          oneOf:
            - type: object
              required: [startedAt, workedMinutes, events]
              properties:
                startedAt: { type: string, format: date-time }
                workedMinutes: { type: integer }
                events: { type: array, items: { $ref: '#/components/schemas/PunchEvent' } }
            - type: 'null'
        todayPlan:
          oneOf:
            - $ref: '#/components/schemas/PlannedShift'
            - type: 'null'
    Flag:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [LATE_START, EARLY_END, MISSING_PUNCH, UNPLANNED, NOT_ENDED] }
        minutes: { type: integer }
        message: { type: string }
    TimesheetDay:
      type: object
      required: [date, planned, sessions, workedMinutes, flags]
      properties:
        date:
          { type: string, format: date, description: 'A shift belongs to the date it started on.' }
        planned:
          oneOf:
            - $ref: '#/components/schemas/PlannedShift'
            - type: 'null'
        sessions:
          type: array
          items:
            type: object
            required: [startedAt, endedAt, status, workedMinutes, events]
            properties:
              startedAt: { type: string, format: date-time }
              endedAt: { type: [string, 'null'], format: date-time }
              status: { type: string, enum: [working, paused, ended] }
              workedMinutes: { type: integer }
              events: { type: array, items: { $ref: '#/components/schemas/PunchEvent' } }
        workedMinutes: { type: integer, description: 'Paused time excluded.' }
        flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
    Timesheet:
      type: object
      required: [employee, days]
      properties:
        employee: { $ref: '#/components/schemas/PersonRef' }
        days: { type: array, items: { $ref: '#/components/schemas/TimesheetDay' } }
    ShiftDashboard:
      type: object
      required: [from, to, employees]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        employees:
          type: array
          items:
            type: object
            required: [employee, color, days]
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              color:
                { type: integer, description: 'Colour slot 0 to 7; red is never used for people.' }
              days: { type: array, items: { $ref: '#/components/schemas/TimesheetDay' } }
    EditPunchRequest:
      type: object
      additionalProperties: false
      required: [occurredAt]
      properties:
        occurredAt: { type: string, format: date-time }
    AddPunchRequest:
      type: object
      additionalProperties: false
      required: [employeeId, eventType, occurredAt]
      properties:
        employeeId: { type: string, format: uuid }
        eventType: { type: string, enum: [start, pause, end] }
        occurredAt: { type: string, format: date-time }
    PunchChangeRequestInput:
      type: object
      additionalProperties: false
      required: [shiftDate, requestedStart, requestedEnd, reason]
      properties:
        shiftDate: { type: string, format: date }
        requestedStart: { type: string, format: date-time }
        requestedEnd: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PunchChangeRequest:
      type: object
      required: [id, employee, shiftDate, original, requested, reason, status, decidedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        employee: { $ref: '#/components/schemas/PersonRef' }
        shiftDate: { type: string, format: date }
        original:
          type: object
          properties:
            start: { type: [string, 'null'], format: date-time }
            end: { type: [string, 'null'], format: date-time }
        requested:
          type: object
          properties:
            start: { type: [string, 'null'], format: date-time }
            end: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected] }
        decidedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
    Team:
      type: object
      required: [id, name, members, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        members: { type: array, items: { $ref: '#/components/schemas/PersonRef' } }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name, memberIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        memberIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        memberIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    PutOutputRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 0 }
              teamId:
                { type: [string, 'null'], format: uuid, description: 'Empty for personal output.' }
        cleaningHours: { type: number, minimum: 0, maximum: 24, multipleOf: 0.25, default: 0 }
    OutputDay:
      type: object
      required: [date, personal, team, cleaningHours, creditedQuantity, expectedMinutes]
      properties:
        date: { type: string, format: date }
        personal:
          type: array
          items:
            type: object
            required: [productId, name, quantity, expectedMinutes]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              expectedMinutes: { type: number }
        team:
          type: array
          items:
            type: object
            required: [team, loggedBy, members, productId, name, quantity, creditedQuantity]
            properties:
              team: { $ref: '#/components/schemas/PersonRef' }
              loggedBy: { type: string, format: uuid }
              members: { type: array, items: { $ref: '#/components/schemas/PersonRef' } }
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer, description: 'Counted once for the team.' }
              creditedQuantity: { type: number, description: 'Equal share for each member.' }
        cleaningHours: { type: number }
        creditedQuantity:
          { type: number, description: 'Personal quantity plus equal shares of team lines.' }
        expectedMinutes:
          {
            type: number,
            description: 'Quantity / 10 x minutes per 10, team lines shared equally.',
          }
    OutputHistory:
      type: object
      required: [employee, days]
      properties:
        employee: { $ref: '#/components/schemas/PersonRef' }
        days: { type: array, items: { $ref: '#/components/schemas/OutputDay' } }
    ShiftOutputDashboard:
      type: object
      required: [date, employees, totals]
      properties:
        date: { type: string, format: date }
        employees:
          type: array
          items:
            type: object
            required: [employee, workedMinutes, flags, output]
            properties:
              employee: { $ref: '#/components/schemas/PersonRef' }
              workedMinutes: { type: integer }
              flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
              output: { $ref: '#/components/schemas/OutputDay' }
        totals:
          type: array
          items:
            type: object
            required: [productId, name, quantity]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
    Task:
      type: object
      required:
        [
          id,
          type,
          title,
          description,
          assignee,
          createdBy,
          dueDate,
          status,
          completedAt,
          completedBy,
          photos,
          ingredientOrderId,
          version,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [general, ingredient_order] }
        title: { type: string }
        description: { type: [string, 'null'] }
        assignee:
          description: Empty for ingredient-order tasks, which go to the admins.
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        dueDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [open, done] }
        completedAt: { type: [string, 'null'], format: date-time }
        completedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        photos:
          type: array
          items:
            type: object
            required: [id, url, takenAt]
            properties:
              id: { type: string, format: uuid }
              url: { type: string, description: Short-lived link. }
              takenAt: { type: string, format: date-time, description: Recorded by the server. }
        ingredientOrderId: { type: [string, 'null'], format: uuid }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, assigneeId, dueDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        assigneeId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        assigneeId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
    CaptureToken:
      type: object
      required: [captureToken, expiresAt]
      properties:
        captureToken: { type: string }
        expiresAt: { type: string, format: date-time }
    CreateIngredientOrderRequest:
      type: object
      additionalProperties: false
      required: [ingredientId, quantity]
      properties:
        ingredientId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, description: Number of packs. }
        note: { type: string, maxLength: 500 }
    IngredientOrder:
      type: object
      required:
        [
          id,
          ingredient,
          quantity,
          note,
          status,
          requestedBy,
          fulfilledBy,
          fulfilledAt,
          checkedBy,
          checkedAt,
          taskId,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        ingredient:
          type: object
          required: [id, name, source, packQuantity, packUnit]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            source: { type: string }
            packQuantity: { type: number }
            packUnit: { $ref: '#/components/schemas/PackUnit' }
        quantity: { type: integer, description: Number of packs. }
        packPrice:
          {
            type: [integer, 'null'],
            description: 'Won per pack when ordered; only for callers allowed to read prices.',
          }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [requested, fulfilled, checked] }
        requestedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        fulfilledBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        fulfilledAt: { type: [string, 'null'], format: date-time }
        checkedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        checkedAt: { type: [string, 'null'], format: date-time }
        taskId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, organizationId, type, payload, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: [string, 'null'], format: uuid }
        type: { type: string, example: task.assigned }
        payload: { type: object }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    CatalogItem:
      type: object
      required: [id, name, imageUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        imageUrl: { type: string }
    DefaultDeliveryDate:
      type: object
      required: [date, askIfToday, timezone]
      properties:
        date: { type: string, format: date }
        askIfToday:
          {
            type: boolean,
            description: 'True before 10:00 provider time: confirm the order is for today.',
          }
        timezone: { type: string }
    OrderLineInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
    PlaceOrderRequest:
      type: object
      additionalProperties: false
      required: [providerId, deliveryDate, lines]
      properties:
        providerId: { type: string, format: uuid }
        deliveryDate: { type: string, format: date }
        lines:
          {
            type: array,
            minItems: 1,
            maxItems: 200,
            items: { $ref: '#/components/schemas/OrderLineInput' },
          }
    SetOrderLinesRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OrderLineInput' } }
    OrderChangeRequestInput:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OrderLineInput' } }
        note: { type: string, maxLength: 500 }
    Order:
      type: object
      required:
        [
          id,
          provider,
          contractor,
          deliveryDate,
          status,
          placedAt,
          lines,
          openChangeRequestIds,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/PersonRef' }
        contractor: { $ref: '#/components/schemas/PersonRef' }
        deliveryDate: { type: string, format: date }
        status: { type: string, enum: [placed, cancelled] }
        placedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [productId, productName, quantity]
            properties:
              productId: { type: string, format: uuid }
              productName: { type: string, description: 'Copied when ordered.' }
              quantity: { type: integer }
        openChangeRequestIds: { type: array, items: { type: string, format: uuid } }
        version: { type: integer }
    OrderTotals:
      type: object
      required: [deliveryDate, items]
      properties:
        deliveryDate: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            required: [productId, name, quantity]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
    OrderChangeRequest:
      type: object
      required: [id, orderId, contractor, deliveryDate, note, status, items, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        contractor: { $ref: '#/components/schemas/PersonRef' }
        deliveryDate: { type: string, format: date }
        note: { type: [string, 'null'] }
        status: { type: string, enum: [open, closed] }
        items:
          type: array
          items:
            type: object
            required:
              [
                id,
                productId,
                productName,
                fromQuantity,
                toQuantity,
                kind,
                status,
                needsAdmin,
                decidedAt,
              ]
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              productName: { type: string }
              fromQuantity: { type: integer }
              toQuantity: { type: integer }
              kind: { type: string, enum: [add, increase, decrease, remove] }
              status: { type: string, enum: [pending, accepted, rejected] }
              needsAdmin: { type: boolean, description: 'True for decreases and removals.' }
              decidedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Member:
      type: object
      required: [id, role, status, version, user, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Membership id.
        role: { $ref: '#/components/schemas/MembershipRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        version:
          type: integer
          description: Send as If-Match when editing.
        user: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
    CreateMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/MembershipRole' }
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/MembershipRole' }
        status:
          type: string
          const: removed
