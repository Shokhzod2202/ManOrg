openapi: 3.1.0
info:
  title: Organization Management App API
  version: 0.1.0
  description: |
    Single contract for the web app, the mobile app and the AI bot (docs/SPEC.md section 8).

    Conventions
    - Every request except /health and /auth/* carries `Authorization: Bearer <access token>`.
    - Routes that act inside an organization also carry `X-Organization-Id`. The server checks it
      against the caller's active memberships: no membership there answers 404, a role without
      the permission answers 403.
    - Errors use `{ "error": { "code", "message", "fields" } }`.
    - Lists return `{ items, nextCursor }`; pass `cursor` back to get the next page.
    - Edits send `If-Match` with the row `version`; a stale version answers 409 VERSION_CONFLICT.

    `x-tenant-scoped: true` on an operation means its response holds organization data; the
    tenant-isolation suite calls every such GET and fails if it returns another organization's
    rows.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: account
  - name: organizations
  - name: applications
  - name: members
  - name: ingredients
  - name: products
  - name: dashboards
  - name: deliveries
  - name: orders
  - name: tasks
  - name: notifications
  - name: output
  - name: shifts

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      x-tenant-scoped: false
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /auth/register:
    post:
      operationId: register
      summary: Create an ordinary account (ACC-2)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: 'Forgot password: email a reset link'
      description: If an account uses the email, a one-time link to the web app's /reset-password page is emailed; it works for 30 minutes and once, and replaces earlier links. The answer is the same whether or not the email is known (decided 2026-11-29). Rate-limited like sign-in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with the emailed link
      description: The token from the link and the new password. Every session of the account ends; the person is told by email. Expired, used or unknown links answer 400 RESET_LINK_INVALID.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 20, maxLength: 200 }
                password: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Exchange a refresh token for a new pair; the old one stops working
      description: Presenting a refresh token that was already used signs out every session that descends from it.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out; the refresh token and every token from the same sign-in stop working
      description: Always 204, whether or not the token was known.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Signed out. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me:
    get:
      operationId: getMe
      summary: Own account and memberships
      tags: [account]
      x-tenant-scoped: false
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      operationId: updateMe
      summary: Edit own account in Settings (ACC-8)
      description: Name, email, password and language can change; role cannot. Changing email or password needs `currentPassword`. A new password signs out other sessions.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/device-session:
    post:
      operationId: createDeviceSession
      summary: "A separate session for the Haydar phone app's background work"
      description: "Called by the web app only when it runs inside the phone app, which stores the token in the phone's secure storage. The arrival check (spec section 9) runs while the app is closed. Its own refresh-token family; audited."
      tags: [account]
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [refreshToken, expiresIn]
                properties:
                  refreshToken: { type: string }
                  expiresIn: { type: integer, description: Access token lifetime in seconds. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/avatar:
    post:
      operationId: setAvatar
      summary: Set your profile picture
      description: JPEG, PNG or WebP up to 5 MB, checked by its content. Audited.
      tags: [account]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413':
          description: The picture is larger than 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeAvatar
      summary: Remove your profile picture
      tags: [account]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      summary: Sign out on every device
      description: Ends every session of this account, this one too, and stops phone notifications. Audited.
      tags: [account]
      responses:
        '204': { description: Signed out everywhere. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/devices:
    post:
      operationId: registerDevice
      summary: 'Register the phone for push notifications (Expo push token)'
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, platform]
              properties:
                token: { type: string, minLength: 10, maxLength: 300 }
                platform: { type: string, enum: [ios, android] }
      responses:
        '204': { description: Registered. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me/devices/remove:
    post:
      operationId: removeDevice
      summary: "Stop push to this phone (on sign-out); only the caller's own token"
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 10, maxLength: 300 }
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me/telegram:
    get:
      operationId: getTelegramStatus
      summary: Whether this account gets notifications in Telegram
      description: Telegram runs alongside the phone app (decided 2026-11-13). The bot sends the same notifications as the app.
      tags: [account]
      x-tenant-scoped: false
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      operationId: disconnectTelegram
      summary: Stop Telegram notifications for this account
      description: Audited. The bot says goodbye in the chat; in-app notifications stay.
      tags: [account]
      responses:
        '204': { description: Disconnected. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/telegram/link:
    post:
      operationId: createTelegramLink
      summary: A one-time link that opens the bot and connects this account
      description: 'The link is t.me/<bot>?start=<code>, valid for 15 minutes and usable once; only a hash of the code is stored. Pressing Start in Telegram connects the chat. 503 TELEGRAM_NOT_CONFIGURED when the server has no bot token.'
      tags: [account]
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503':
          description: Telegram is not set up on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /telegram/webhook:
    post:
      operationId: telegramWebhook
      summary: Updates from Telegram (bot commands /start and /stop)
      description: 'Called by Telegram only, checked with the X-Telegram-Bot-Api-Secret-Token header set in setWebhook (TELEGRAM_WEBHOOK_SECRET). 404 when webhooks are not configured. Only private chats are read.'
      tags: [account]
      security: []
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [update_id]
              properties:
                update_id: { type: integer }
                message:
                  type: object
                  required: [chat]
                  properties:
                    text: { type: string, maxLength: 4096 }
                    chat:
                      type: object
                      required: [id, type]
                      properties:
                        id: { type: integer }
                        type: { type: string }
                    from:
                      type: object
                      properties:
                        username: { type: string }
      responses:
        '200':
          description: Handled.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bot:
    get:
      operationId: getBotStatus
      summary: "Whether the AI bot is set up, and this month's usage (spec section 10)"
      tags: [bot]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bot/conversations:
    get:
      operationId: listBotConversations
      summary: "The caller's bot conversations, newest first (kept 90 days)"
      tags: [bot]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, createdAt, updatedAt]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bot/conversations/{id}:
    get:
      operationId: getBotConversation
      summary: "One conversation: what the admin wrote, the bot's replies, and its proposals"
      tags: [bot]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotConversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bot/messages:
    post:
      operationId: sendBotMessage
      summary: 'Send the bot an instruction; reads run now, writes come back as proposals'
      description: 'The model only reads this organization through its tools. Every write becomes a proposal the admin confirms. 429 BOT_RATE_LIMITED or BOT_BUDGET_REACHED; 503 BOT_NOT_CONFIGURED or BOT_UNAVAILABLE.'
      tags: [bot]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                conversationId: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: The bot's reply.
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, reply, messages, proposals]
                properties:
                  conversationId: { type: string, format: uuid }
                  reply: { type: string }
                  messages: { type: array, items: { $ref: '#/components/schemas/BotMessage' } }
                  proposals: { type: array, items: { $ref: '#/components/schemas/BotProposal' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: No model is set up, or it could not answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /bot/proposals/{id}/confirm:
    post:
      operationId: confirmBotProposal
      summary: 'Apply a proposal; above 20 rows send second: true'
      description: 'Runs through the normal services and permission checks; audit rows say actor bot on behalf of the admin. 409 SECOND_CONFIRMATION_REQUIRED, PROPOSAL_DECIDED or PROPOSAL_EXPIRED. A proposal that could not be applied comes back with status failed and the reason.'
      tags: [bot]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                second: { type: boolean, default: false }
      responses:
        '200':
          description: The proposal after the attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotProposal' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bot/proposals/{id}/cancel:
    post:
      operationId: cancelBotProposal
      summary: 'Discard a proposal'
      tags: [bot]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The cancelled proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotProposal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /product-types:
    get:
      operationId: listProductTypes
      summary: Product types (decided 2026-11-30)
      tags: [products]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: A to Z.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductType' } }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProductType
      summary: Add a product type, e.g. Meal or Bakery
      description: The same name again (any letter case) returns the existing type. Audited.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201':
          description: The type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductType' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /product-types/{id}:
    patch:
      operationId: renameProductType
      summary: Rename a product type
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '200':
          description: The type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductType' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/order:
    put:
      operationId: setProductOrder
      summary: Save the custom product order
      description: The product ids in the wanted order, first first (drag and drop on Products). Products left out keep their order after them. Audited (decided 2026-11-30).
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productIds]
              properties:
                productIds:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The whole order now.
          content:
            application/json:
              schema:
                type: object
                required: [productIds]
                properties:
                  productIds: { type: array, items: { type: string, format: uuid } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}/price:
    put:
      operationId: setProductPrice
      summary: 'Set the unit price in whole won; applies from now on (F-001 FIN-1, FIN-5)'
      description: 'Audited. Past deliveries keep the price copied when they were completed.'
      tags: [finance]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [unitPrice],
                properties: { unitPrice: { type: integer, minimum: 0, maximum: 100000000 } },
              }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/prices:
    get:
      operationId: listProductPrices
      summary: 'Price history of a product'
      tags: [finance]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [items, nextCursor],
                  properties:
                    {
                      items:
                        {
                          type: array,
                          items:
                            {
                              type: object,
                              required: [id, unitPrice, effectiveFrom, createdById],
                              properties:
                                {
                                  id: { type: string, format: uuid },
                                  unitPrice: { type: integer },
                                  effectiveFrom: { type: string, format: date-time },
                                  createdById: { type: string, format: uuid },
                                },
