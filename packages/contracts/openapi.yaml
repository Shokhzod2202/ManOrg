openapi: 3.1.0
info:
  title: Organization Management App API
  version: 0.1.0
  description: |
    Single contract for the web app, the mobile app and the AI bot (docs/SPEC.md section 8).

    Conventions
    - Every request except /health and /auth/* carries `Authorization: Bearer <access token>`.
    - Routes that act inside an organization also carry `X-Organization-Id`. The server checks it
      against the caller's active memberships: no membership there answers 404, a role without
      the permission answers 403.
    - Errors use `{ "error": { "code", "message", "fields" } }`.
    - Lists return `{ items, nextCursor }`; pass `cursor` back to get the next page.
    - Edits send `If-Match` with the row `version`; a stale version answers 409 VERSION_CONFLICT.

    `x-tenant-scoped: true` on an operation means its response holds organization data; the
    tenant-isolation suite calls every such GET and fails if it returns another organization's
    rows.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: account
  - name: organizations
  - name: applications
  - name: members
  - name: ingredients
  - name: products
  - name: orders
  - name: tasks
  - name: notifications
  - name: output
  - name: shifts

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      x-tenant-scoped: false
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /auth/register:
    post:
      operationId: register
      summary: Create an ordinary account (ACC-2)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Exchange a refresh token for a new pair; the old one stops working
      description: Presenting a refresh token that was already used signs out every session that descends from it.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me:
    get:
      operationId: getMe
      summary: Own account and memberships
      tags: [account]
      x-tenant-scoped: false
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      operationId: updateMe
      summary: Edit own account in Settings (ACC-8)
      description: Name, email, password and language can change; role cannot. Changing email or password needs `currentPassword`. A new password signs out other sessions.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations:
    get:
      operationId: searchOrganizations
      summary: Searchable account pool (ACC-3)
      tags: [organizations]
      x-tenant-scoped: false
      parameters:
        - name: q
          in: query
          description: Part of the organization name, case-insensitive.
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matching organizations, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationSummary' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createOrganization
      summary: Create a bakery or contractor organization; the creator becomes its first admin (ACC-4)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOrganization' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{id}/applications:
    post:
      operationId: applyToOrganization
      summary: Apply to a bakery (ACC-5, ACC-6)
      description: |
        Without `X-Organization-Id` the caller applies to join the bakery as an employee.
        With the id of a contractor organization the caller administers, the contractor applies
        to buy from the bakery. A rejected applicant may apply again after 7 days.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OptionalOrganizationId'
      responses:
        '201':
          description: Application created and pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnApplication' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /organization/employee-access:
    get:
      operationId: getEmployeeAccess
      summary: Which read-only areas employees may see (organization admin)
      description: Areas start at their defaults; employees never get write access through this setting.
      tags: [organizations]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Every area with its current switch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeAccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateEmployeeAccess
      summary: Open or close read-only areas for employees (organization admin)
      description: Send only the areas to change. Audited; applies on each employee's next request.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeAccessRequest' }
      responses:
        '200':
          description: The updated setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeAccess' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /organization/bot-access:
    get:
      operationId: getBotAccess
      summary: Extra powers the AI bot has (organization admin)
      description: All start off (spec section 10). The bot can never read or change this setting itself.
      tags: [organizations]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Every area with its current switch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotAccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateBotAccess
      summary: Switch extra bot powers on or off (organization admin)
      description: Send only the switches to change. Audited; applies to the bot's next action.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBotAccessRequest' }
      responses:
        '200':
          description: The updated setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotAccess' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /ingredients:
    get:
      operationId: listIngredients
      summary: The ingredient database (ING-1, ING-3, ING-4)
      description: |
        Everyone who may order ingredients sees every ingredient; the caller's own ordering
        responsibilities come first. `packPrice`, `unitPrice` and `priceEffectiveFrom` appear only for
        callers allowed to read prices (admins, the bot, and employees when the admin opens
        Ingredient prices in Employee access).
      tags: [ingredients]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Ingredients.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Ingredient' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createIngredient
      summary: Add an ingredient (ING-1, ING-8)
      tags: [ingredients]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIngredientRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingredients/{id}:
    get:
      operationId: getIngredient
      tags: [ingredients]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The ingredient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateIngredient
      summary: Edit an ingredient, including what one pack contains (ING-2)
      description: The price has its own endpoint so that a change only affects the future.
      tags: [ingredients]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIngredientRequest' }
      responses:
        '200':
          description: The updated ingredient.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /ingredients/{id}/price:
    put:
      operationId: setIngredientPrice
      summary: Set a new price per pack, in whole won
      description: Effective from now; earlier prices stay in the history and past calculations keep using them.
      tags: [ingredients]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packPrice]
              properties:
                packPrice: { type: integer, minimum: 0, description: Whole won per pack. }
      responses:
        '200':
          description: The ingredient with its new current price.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingredients/{id}/prices:
    get:
      operationId: listIngredientPrices
      summary: Price history, newest first
      tags: [ingredients]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Every price the ingredient has had.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, packPrice, effectiveFrom, createdById]
                      properties:
                        id: { type: string, format: uuid }
                        packPrice: { type: integer }
                        effectiveFrom: { type: string, format: date-time }
                        createdById: { type: string, format: uuid }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingredients/{id}/responsible:
    put:
      operationId: setIngredientResponsible
      summary: Set the employees responsible for ordering an ingredient (ING-4)
      description: Replaces the whole list; send an empty list to clear it. Audited.
      tags: [ingredients]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employeeIds]
              properties:
                employeeIds:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The ingredient with its responsible employees.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /product-images:
    post:
      operationId: uploadProductImage
      summary: Upload a product picture (PRD-1)
      description: JPEG, PNG or WebP up to 5 MB, detected from the file's bytes. Send the returned imageKey when creating or editing a product.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [imageKey, imageUrl]
                properties:
                  imageKey: { type: string }
                  imageUrl: { type: string, description: Short-lived link to the picture. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: The picture is larger than 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products:
    get:
      operationId: listProducts
      summary: The organization's products, available or not (PRD-2)
      tags: [products]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Products by name.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProduct
      summary: Add a product (PRD-1)
      description: Name, picture (imageKey from /product-images), ingredients and minutes per 10 are all required.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProduct
      summary: Edit any product field, or set availability (PRD-2)
      description: An unavailable product cannot be ordered but stays in history. Ingredients, when sent, replace the list.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /employees/{id}/products:
    get:
      operationId: listEmployeeProducts
      summary: Products assigned to an employee (PRD-3)
      description: Admins and the bot see anyone's; an employee sees only their own (their output form lists only these).
      tags: [products]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Assigned products.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setEmployeeProducts
      summary: Assign products to an employee (PRD-3)
      description: Replaces the whole list. Audited.
      tags: [products]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productIds]
              properties:
                productIds:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The employee's products after the change.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files/{key}:
    get:
      operationId: getFile
      summary: Download a stored file through a signed, expiring link
      description: Links come from API responses (for example Product.imageUrl). Used with local storage; production links point at the bucket instead.
      tags: [system]
      security: []
      x-tenant-scoped: false
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shifts:
