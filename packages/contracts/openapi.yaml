    put:
      operationId: setSettlementSchedule
      summary: 'Replace the periods that are not closed (SET-3, SET-5, SET-6)'
      description: 'Periods follow each other day by day; the first starts right after the last closed one; a period under way keeps its start. 409 PERIOD_CLOSED when touching a closed period. Audited with old and new dates.'
      tags: [finance]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [periods],
                properties:
                  {
                    periods:
                      {
                        type: array,
                        items:
                          {
                            type: object,
                            additionalProperties: false,
                            required: [startDate, endDate, kind],
                            properties:
                              {
                                startDate: { type: string, format: date },
                                endDate: { type: string, format: date },
                                kind: { type: string, enum: [mid_month, month_end, custom] },
                              },
                          },
                      },
                  },
              }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [items, nextCursor],
                  properties:
                    {
                      items:
                        { type: array, items: { $ref: '#/components/schemas/SettlementPeriod' } },
                      nextCursor: { $ref: '#/components/schemas/NextCursor' },
                    },
                }
