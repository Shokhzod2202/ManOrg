openapi: 3.1.0
info:
  title: Organization Management App API
  version: 0.1.0
  description: |
    Single contract for the web app, the mobile app and the AI bot (docs/SPEC.md section 8).

    Conventions
    - Every request except /health, /auth/* and /telegram/webhook carries `Authorization: Bearer <access token>`.
    - `POST /telegram/webhook` is the Telegram bot webhook. On the public host the proxy also
      serves it at `/api/telegram/webhook`. It is authenticated with the header
      `X-Telegram-Bot-Api-Secret-Token`, not a bearer token.
    - Routes that act inside an organization also carry `X-Organization-Id`. The server checks it
      against the caller's active memberships: no membership there answers 404, a role without
      the permission answers 403.
    - Errors use `{ "error": { "code", "message", "fields" } }`.
    - Lists return `{ items, nextCursor }`; pass `cursor` back to get the next page.
    - Edits send `If-Match` with the row `version`; a stale version answers 409 VERSION_CONFLICT.

    `x-tenant-scoped: true` on an operation means its response holds organization data; the
    tenant-isolation suite calls every such GET and fails if it returns another organization's
    rows.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: account
  - name: organizations
  - name: applications
  - name: members

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      x-tenant-scoped: false
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /health/ready:
    get:
      operationId: getReady
      tags: [system]
      summary: Readiness, including the database
      security: []
      x-tenant-scoped: false
      responses:
        '200':
          description: The API can reach the database.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/register:
    post:
      operationId: register
      summary: Create an ordinary account (ACC-2)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Exchange a refresh token for a new pair; the old one stops working
      description: Presenting a refresh token that was already used signs out every session that descends from it.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/telegram:
    post:
      operationId: loginWithTelegram
      summary: Sign in with Telegram Mini App initData
      description: |
        Send the raw `Telegram.WebApp.initData` string. The server checks the HMAC with the bot
        token and the auth_date. A user id, username, or forged initData is not accepted, and there
        is no development bypass. The account is keyed by the Telegram user id. Email and password
        stay empty until the person sets them in Settings.

        Only Telegram user ids listed in the server's bootstrap admin list become admin of the one
        bootstrap bakery, and only when they do not already belong to an organization. Removing that
        admin in the app is sticky: a later sign-in does not grant the role again. Every other
        Telegram user gets an ordinary account with no membership.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramLoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramAuthResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /telegram/webhook:
    post:
      operationId: telegramWebhook
      summary: Telegram bot webhook (messages only)
      description: |
        Telegram calls this with header `X-Telegram-Bot-Api-Secret-Token`. The proxy exposes the
        same handler at `/api/telegram/webhook` so the existing bot URL can stay.
        Private messages are answered with a pointer to the Mini App. `/start` and `/help` include
        an Open App button. Group messages and non-message updates are acknowledged and ignored.
        The chat does not take orders or change data.
      tags: [system]
      security: []
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Telegram Update. Unknown fields are ignored.
              additionalProperties: true
      responses:
        '200':
          description: Accepted. `ignored` means nothing was sent back to the chat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramWebhookResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me:
    get:
      operationId: getMe
      summary: Own account and memberships
      tags: [account]
      x-tenant-scoped: false
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      operationId: updateMe
      summary: Edit own account in Settings (ACC-8)
      description: Name, email, password and language can change; role cannot. Changing email or password needs `currentPassword`. A new password signs out other sessions.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations:
    get:
      operationId: searchOrganizations
      summary: Searchable account pool (ACC-3)
      tags: [organizations]
      x-tenant-scoped: false
      parameters:
        - name: q
          in: query
          description: Part of the organization name, case-insensitive.
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matching organizations, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationSummary' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createOrganization
      summary: Create a bakery or contractor organization; the creator becomes its first admin (ACC-4)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedOrganization' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{id}/applications:
    post:
      operationId: applyToOrganization
      summary: Apply to a bakery (ACC-5, ACC-6)
      description: |
        Without `X-Organization-Id` the caller applies to join the bakery as an employee.
        With the id of a contractor organization the caller administers, the contractor applies
        to buy from the bakery. A rejected applicant may apply again after 7 days.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OptionalOrganizationId'
      responses:
        '201':
          description: Application created and pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnApplication' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /applications:
    get:
      operationId: listApplications
      summary: Pending employee and contractor applications (bakery admin)
      tags: [applications]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Pending applications, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /applications/{id}/approve:
    post:
      operationId: approveApplication
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Approved. An employee gets the Employee role; a contractor may order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /applications/{id}/reject:
    post:
      operationId: rejectApplication
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /members:
    get:
      operationId: listMembers
      summary: Members of the organization (admins)
      tags: [members]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: status
          in: query
          schema: { type: string, enum: [active, removed], default: active }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Members, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createMember
      summary: Add an existing account, e.g. as another admin (ACC-7)
      description: Contractor organizations take admins only.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMemberRequest' }
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /members/{id}:
    patch:
      operationId: updateMember
      summary: Change a member's role or remove them (ACC-7)
      description: Audited. The organization always keeps one active admin. Takes effect on the member's next request.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: true
      description: The organization the request acts in; must be one of the caller's active memberships.
      schema: { type: string, format: uuid }
    OptionalOrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `version` of the record being edited.
      schema: { type: string, example: '"3"' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: '`nextCursor` from the previous page.'
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: The request is not valid; `fields` names each problem.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing, expired or wrong credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The caller's role does not allow this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or not in the caller's organization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with the current state (for example VERSION_CONFLICT, ALREADY_IN_ORGANIZATION, LAST_ADMIN).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: The request is valid but breaks a business rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: If-Match is required on this edit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many attempts; wait a minute.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: A required dependency or server setting is missing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    NextCursor:
      type: [string, 'null']
      format: uuid

    OrganizationType:
      type: string
      enum: [bakery, contractor]
    MembershipRole:
      type: string
      enum: [admin, employee]
    MembershipStatus:
      type: string
      enum: [pending, active, rejected, removed]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 200 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TelegramLoginRequest:
      type: object
      additionalProperties: false
      required: [initData]
      properties:
        initData:
          type: string
          minLength: 1
          maxLength: 8192
          description: Raw Telegram.WebApp.initData. Do not send a user id by itself.
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
    UserSummary:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email:
          type: [string, 'null']
          format: email
        telegramUserId:
          type: [string, 'null']
          description: Decimal Telegram user id when the account is linked.
          pattern: '^[1-9][0-9]{0,18}$'
        telegramUsername:
          type: [string, 'null']
    AuthResult:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
    TelegramAuthResult:
      type: object
      required: [user, tokens, provisioning]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        provisioning:
          type: string
          enum:
            - not_bootstrap_admin
            - created_organization
            - joined_organization
            - already_member
            - skipped_other_organization
    TelegramWebhookResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
        ignored: { type: boolean }
        delivered: { type: boolean }

    Me:
      type: object
      required: [id, name, email, telegramUserId, telegramUsername, locale, memberships]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email:
          type: [string, 'null']
          format: email
        telegramUserId:
          type: [string, 'null']
        telegramUsername:
          type: [string, 'null']
        locale: { type: string, enum: [en, ko, uz] }
        memberships:
          type: array
          description: Newest first; includes pending and rejected applications.
          items:
            type: object
            required: [id, role, status, organization]
            properties:
              id: { type: string, format: uuid }
              role: { $ref: '#/components/schemas/MembershipRole' }
              status: { $ref: '#/components/schemas/MembershipStatus' }
              organization: { $ref: '#/components/schemas/OrganizationSummary' }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 200 }
        currentPassword:
          type: string
          description: Required when the account already has a password and email or password is changing. A Telegram-only account can set them once without it.
        locale: { type: string, enum: [en, ko, uz] }

    OrganizationSummary:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/OrganizationType' }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { $ref: '#/components/schemas/OrganizationType' }
        timezone:
          type: string
          description: IANA time zone; defaults to Asia/Seoul.
          example: Asia/Seoul
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CreatedOrganization:
      type: object
      required: [organization, membership]
      properties:
        organization:
          type: object
          required: [id, name, type, timezone, version]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            type: { $ref: '#/components/schemas/OrganizationType' }
            timezone: { type: string }
            version: { type: integer }
        membership:
          type: object
          required: [id, role, status]
          properties:
            id: { type: string, format: uuid }
            role: { $ref: '#/components/schemas/MembershipRole' }
            status: { $ref: '#/components/schemas/MembershipStatus' }

    OwnApplication:
      type: object
      required: [id, kind, status, organization, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [employee, contractor] }
        status: { type: string, enum: [pending, approved, rejected, active] }
        organization: { $ref: '#/components/schemas/OrganizationSummary' }
        createdAt: { type: string, format: date-time }
    Application:
      type: object
      required: [id, kind, status, applicant, contractor, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [employee, contractor] }
        status:
          type: string
          description: Employee applications become `active` or `rejected`; contractor applications `approved` or `rejected`.
          enum: [pending, active, approved, rejected]
        applicant:
          description: The person who applied (for a contractor, the admin who applied for it).
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        contractor:
          description: The contractor organization; empty for employee applications.
          oneOf:
            - $ref: '#/components/schemas/OrganizationSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [id, role, status, version, user, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Membership id.
        role: { $ref: '#/components/schemas/MembershipRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        version:
          type: integer
          description: Send as If-Match when editing.
        user: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
    CreateMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/MembershipRole' }
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/MembershipRole' }
        status:
          type: string
          const: removed
