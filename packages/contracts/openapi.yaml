  /payments:
    post:
      operationId: submitPayment
      summary: 'Submit a payment confirmation with proof (PAY-1)'
      description: 'Contractor admins. Pending until the bakery admin reviews it; audited; the bakery admins are notified.'
      tags: [finance]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              {
                type: object,
                required: [providerId, amount, proof],
                properties:
                  {
                    providerId: { type: string, format: uuid },
                    amount: { type: integer, minimum: 1 },
                    note: { type: string, maxLength: 500 },
                    proof:
                      {
                        type: string,
                        format: binary,
                        description: 'JPEG, PNG, WebP or PDF up to 10 MB',
                      },
                  },
              }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: listPayments
      summary: 'Payment review queue (bakery) or own submissions (contractor) (PAY-2, AFD-8)'
      tags: [finance]
      x-tenant-scoped: true
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
